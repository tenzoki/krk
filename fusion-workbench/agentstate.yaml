  key_findings: >
    STAND. Alle 36 Planschritte tragen [DONE]. Runde 1 schließt nicht vor der
    Klärung der L9-Frage (Nutzerentscheid 260806, ausdrücklich offen gehalten).
    HEAD bei Sitzungsbeginn f9a0462, Arbeitsverzeichnis sauber, make check grün.

    D1 IST ERLEDIGT (3e9613a). Der Nutzer hat einen fünften Weg gewählt, den der
    Defektbericht nicht führte: die Überschrift der Spalte bleibt "Typ", die
    Zelle zeigt die Dateiendung. Drei geprüfte Befunde trugen die Wahl. Ordner
    stehen in jeder der acht Sortierungen vorn, die Eintragsart bleibt also an
    der Position ablesbar; verloren geht allein die Kennzeichnung der
    Verknüpfung. Die Tastenfunktion heißt "Nach Typ sortieren" (Cmd+4) in
    resources/default-keymap.toml, eine Spalte "Endung" verschöbe den Namensbruch
    dorthin. Und der Spec schreibt die Überschrift nirgends fest, C1 zählt die
    Spalten nicht auf.

    WIE GEBAUT WIRD. cargo liegt nicht auf dem Standard-PATH, sondern unter
    $HOME/.cargo/bin. Das Makefile im Wurzelverzeichnis setzt den PATH selbst:
    make check fährt die vier Abnahmekommandos, make bundle baut und signiert,
    make alle fährt die volle Messstrecke, make fixture legt die Prüfordner an.
    Der Messplatz liegt unter ~/Library/Caches/krk-messplatz, nicht mehr /tmp.

    MESSEN. Der Abnahmelauf verlangt KRK im Vordergrund — aus dem Hintergrund
    gestartet weist die Wirkungsbereichs-Prüfung jeden fokusgebundenen Befehl
    ab, und die Strecke meldet NICHT_IM_VORDERGRUND. Aus einem Terminalfenster
    im Vordergrund läuft sie durch. Die offene Frage dazu ist 260806-1303.
    Synthetische Tastendrücke gehören in KRKs eigene Ereignisschlange über
    postEvent:atStart:, nicht über osascript.

    ZWEI AUFGABEN TRAGEN NOCH EIN NUTZER-GATE. D8 ist eine ontocoder-Aufgabe.
    R1 ist die L9-Frage und hält die Rundenschließung.

    WAS DER NÄCHSTE CODER WISSEN MUSS. Der Wirkungsbereich in belegung.rs ist
    eine vollständige Fallunterscheidung ohne Auffangzweig mit vier Werten;
    jedes neue Kommando braucht dort eine Zeile. Dasselbe gilt für
    schiebt_auffrischung_auf in auffrischung.rs und für bereich_des_kommandos
    in belegungsmodell.rs. Der Sortierschlüssel entsteht einmal beim Lesen und
    trägt die Kollation als Bytefolge — das ist die Voraussetzung dafür, dass
    L3 und L10 halten, und darf nicht in einen paarweisen Vergleich zurück.

    GIT. Identität ist seit dem 260806 lokal gesetzt (Kai Stalmann,
    kai@stalmann.org), der Fernzugriff steht auf tenzoki/krk. Nichts gepusht.

    GUARD. Ein mv oder rm mit einem Pfad aus einer Shell-Variablen wird
    fail-closed abgewiesen. Marker-Umbenennungen im workbench deshalb mit
    ausgeschriebenen absoluten Pfaden.
