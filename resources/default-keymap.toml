# KRK — Auslieferungsbelegung der Tasten
#
# Diese Datei ist die alleinige Quelle der ausgelieferten Tastenbelegung. Die
# Belegungsmaschine aus Schritt 11 des Plans bindet sie ueber `include_str!`
# ein und loest damit die fest verdrahtete Tabelle aus Schritt 7 ab; eine
# zweite Belegungstabelle im Code gibt es danach nicht mehr.
#
# Quelle: Spec `260802-1036_*_spec-navigator-geruest.md`, Faehigkeiten C1 bis
# C7, C10 und C11. Die sechs Norton-Funktionen und ihre Cmd-Kuerzel stehen dort
# in der Tabelle "Die ausgelieferten Cmd-Kuerzel" in C3. Bindend sind ausserdem
# `shared/decisions/260802-0842_*_f-tasten-unter-macos-systembelegung.md` und
# `shared/decisions/260802-0842_*_loeschen-papierkorb-oder-endgueltig.md`.
#
# Aufbau je Eintrag:
#   id               maschinenlesbarer Bezeichner, ASCII, ohne Umlaute
#   name             deutsche Beschriftung fuer die Belegungsansicht
#   tasten           Liste aller Kombinationen, die diese Funktion ausloesen
#   reserviert_fuer  optional; die Funktion ist benannt und ab Werk unbelegt
#   gehalten_von     optional; wer den Tastendruck zustellt, nicht was er tut.
#                    Einziger Wert "menue": ein NSMenuItem traegt die
#                    Kombination als Kuerzel, der Ereignisabgriff fuehrt sie
#                    nicht aus, und die Antwortkette entscheidet, wer sie
#                    beantwortet. Eine solche Funktion bekommt nie ein
#                    Kommando. Ohne das Feld waere sie von einer Funktion
#                    nicht zu unterscheiden, deren Kommando ein spaeterer
#                    Schritt erst baut. Einen Eintrag dieser zweiten Sorte
#                    liefert die Datei derzeit nicht; bis zum 260810 stand
#                    hier "belegung_ansehen" als Beispiel, und es traegt
#                    inzwischen selbst ein Kommando.
#
# Eine Funktion traegt genau einen Eintrag, auch wenn sie mehrere
# Kombinationen hat. Das ist die Ein-Zeilen-Regel der Belegungsansicht aus C3.
# Ausgeliefert sind 74 Funktionen mit zusammen 82 Kombinationen.
#
# Kombinationsschreibweise: [ctrl+][opt+][shift+][cmd+]<taste>, in genau
# dieser Reihenfolge. Sie folgt der Reihenfolge, in der macOS die Zusatztasten
# schreibt (ctrl, opt, shift, cmd). "Cmd+Shift+K" aus der Spec-Tabelle heisst
# hier deshalb `shift+cmd+k`: dieselbe Kombination, in der Schreibweise dieser
# Datei.
#
# Tastennamen: f1 bis f12, delete, up, down, left, right, pageup, pagedown,
# home, end, return, tab, esc, space sowie Buchstaben und Ziffern.
#
# Die fn-Taste ist keine Zusatztaste dieser Schreibweise und kommt in keiner
# Kombination vor. Funktionstasten schlaegt KRK ueber den Tastencode nach, und
# F3 mit gehaltener fn-Taste erzeugt denselben Tastencode wie ein nacktes F3
# (C3; gemessen ist allein der Fall mit gehaltener fn-Taste,
# `spikes/fn-tasten/messung-A.txt` Ereignisse #03 bis #05; der Gleichlauf
# beider Faelle ist daraus abgeleitet und am Referenzgeraet nicht messbar, weil
# dessen Touch Bar ohne gehaltenes fn ueberhaupt keine F3 liefert).
#
# Eine Kombination bleibt ab Werk ausdruecklich frei und steht deshalb in keiner
# Tastenliste: Umschalt+Entf.
#
# Die Eingabetaste stand bis zum 260811 daneben. Sie trug bis zum 260804 den
# Einstieg in einen Ordner; der liegt seither auf einem Rechtspfeil, bis zum
# 260805 auf cmd+right und seither auf dem nackten right, und der Nutzer hat die
# Eingabetaste damals ausdruecklich freigegeben (C2 der Runde 1). Seit dem
# 260811 traegt sie "mit_standardprogramm_oeffnen" (C3 der Runde 4,
# Nutzerantwort vom 260811-1505); der Eintrag steht weiter unten und nennt den
# Grund. Ein stehendes Blatt faengt sie weiterhin ab, bevor sie hier
# nachgeschlagen wird, und die Vorgabeschaltflaeche beantwortet sie wie zuvor.
#
# Cmd+C und Cmd+V standen bis zum 260805 in dieser Aufzaehlung. Sie tragen
# seither die Textbefehle des Menues "Bearbeiten" und sonst nichts, und genau
# das haelt sie fuer die Dateizwischenablage einer spaeteren Runde frei: ohne
# jenes Menue erreicht Cmd+V ueberhaupt kein Textfeld. Die Reservierung aus C3
# ist damit eingeloest und nicht gebrochen; C3 schreibt aus, warum
# (Nutzerentscheid vom 260805-0000, `decisions/
# 260805-0000_*_menuekuerzel-in-die-konflikterkennung-oder-daneben.md`).
#
# Eine Kombination kann im Textfeld etwas anderes bedeuten als im Dateifenster,
# und das ist kein zweiter Mechanismus, sondern der Fokusvorbehalt aus C2.
# Steht die Schreibmarke in einem Textfeld, reicht der Ereignisabgriff den
# Tastendruck unveraendert an AppKit weiter, und erst dort wirkt das Menue;
# steht sie im Dateifenster, schlaegt er in dieser Datei nach.
#
# Der Vorbehalt fragt vor dem Nachschlag und nicht nach der Kombination, und
# darum traegt er eine nackte Taste genauso wie eine mit Zusatztaste. Seit dem
# 260805 ist das der Alltagsfall und nicht mehr der Randfall: left und right
# steigen im Dateifenster aus einem Ordner aus und in einen ein, und in jedem
# Textfeld bewegen dieselben beiden Tasten die Schreibmarke, wie ueberall auf
# dem Mac. In der Pfadeingabe aus C2 haengt daran, dass ein getippter Pfad
# zeichenweise begehbar bleibt.
#
# Daraus folgt, dass dieselbe Kombination bei zwei Funktionen stehen darf,
# sofern verschiedene Zusteller sie tragen. Ein Konflikt sind zwei Funktionen
# genau dann, wenn sie dieselbe Kombination tragen und denselben Zusteller
# haben; der Fokusvorbehalt teilt jeden Tastendruck genau einem der beiden zu,
# und zwei Funktionen mit verschiedenen Zustellern begegnen einander nie. Zwei
# vom Menue gehaltene Funktionen auf einer Kombination bleiben ein Konflikt,
# zwei Funktionen des Dateifensters erst recht. Ausgeliefert gibt es genau
# einen Fall der Doppelung: cmd+a markiert im Dateifenster ueber
# "alle_markieren" alle Eintraege und waehlt im Textfeld ueber
# "text_alles_auswaehlen" den Text aus, wie auf dem Mac ueblich
# (Nutzerentscheid vom 260805, `decisions/
# 260805-0713_*_ist-eine-kombination-bei-zwei-zustellern-ein-konflikt.md`).
#
# Das Tippen der Anfangsbuchstaben aus C2 ist keine Belegung und steht darum
# nicht hier: es ist der Rueckfall fuer jede Taste ohne Zusatztaste, die
# keiner Funktion zugeordnet ist (Plan, Schritt 11).

# ── C3 und C4: die Norton-Reihe, je zwei Wege ────────────────────────────────
# Jede dieser Funktionen ist ueber die Funktionstaste und ueber ein
# Cmd-Kuerzel erreichbar. Beide Wege stehen in derselben Zeile.

[[funktion]]
id = "vorschau_umschalten"
name = "Vorschau anzeigen und ausblenden"
tasten = ["f3", "cmd+y"]
# C3 setzt "Vorschau anzeigen" mit dem Ein- und Ausblenden des
# Vorschaufensters aus C7 gleich: eine Funktion, ein Eintrag.

[[funktion]]
id = "kopieren"
name = "In das andere Fenster kopieren"
tasten = ["f5", "shift+cmd+k"]

[[funktion]]
id = "verschieben"
name = "In das andere Fenster verschieben"
tasten = ["f6", "shift+cmd+v"]

[[funktion]]
id = "ordner_anlegen"
name = "Ordner anlegen"
tasten = ["f7", "shift+cmd+n"]

[[funktion]]
id = "endgueltig_loeschen"
name = "Endgültig löschen"
tasten = ["f8", "opt+cmd+delete"]

[[funktion]]
id = "in_papierkorb"
name = "In den Papierkorb räumen"
tasten = ["delete", "cmd+delete"]

[[funktion]]
id = "bearbeiten"
name = "Bearbeiten"
tasten = ["f4"]
# Der Eintrag stand bis zur Editor-Runde mit `reserviert_fuer = "editor"` und
# ohne Kombination hier: die Norton-Bedeutung "Bearbeiten" zeigt auf den Editor,
# und den gab es noch nicht. Er oeffnet jetzt den ausgewaehlten Eintrag des
# Dateifensters im eingebauten Editor (C1 der Editor-Runde).
#
# Es bleibt bei der einen Taste. Die Zwei-Wege-Regel aus C3 gilt den sechs
# Funktionen der Norton-Reihe ganz oben; `bearbeiten` gehoert zu den spaeteren
# Funktionen, die je eine tragen, wie "terminal_oeffnen" weiter unten. Ein
# Cmd-Kuerzel daneben braucht es auch sachlich nicht: der zweite Einstiegsweg in
# den Editor ist kein zweiter Weg auf dieselbe Handlung, sondern eine eigene
# Funktion mit eigener Quelle ("editor_aus_vorschau" weiter unten).

# ── C1: Dateifenster und Tabs ────────────────────────────────────────────────
# Dieselben vier Tabbefehle bedienen nach C6 auch die Tabs des
# Vorschaufensters. Drei von ihnen wirken auf den Bereich mit Tabs, der den
# Eingabefokus hat. "tab_schliessen" wirkt seit C4 der Runde 4 aus jedem Fokus
# (Nutzerantwort vom 260811-1505): mit dem Fokus in einem Dateifenster oder in
# der Vorschau schliesst es deren aktiven Tab wie bisher, mit dem Fokus in der
# Leiste oder im Editor den des aktiven Dateifensters. Der Editor bleibt dabei
# offen und behaelt seinen Stand. Bei stehendem Blatt kommt es weiterhin nicht
# durch, und damit auch nicht in der Belegungsansicht: dort bleibt "esc" der
# Weg heraus.

[[funktion]]
id = "tab_neu"
name = "Neuen Tab öffnen"
tasten = ["cmd+t"]

[[funktion]]
id = "tab_schliessen"
name = "Aktiven Tab schließen"
tasten = ["cmd+w"]

[[funktion]]
id = "tab_naechster"
name = "Zum nächsten Tab"
tasten = ["ctrl+tab"]

[[funktion]]
id = "tab_voriger"
name = "Zum vorigen Tab"
tasten = ["ctrl+shift+tab"]

[[funktion]]
id = "fenster_wechseln"
name = "Aktives Dateifenster wechseln"
tasten = ["tab"]

# ── C2: Navigation in der Liste ──────────────────────────────────────────────

[[funktion]]
id = "auswahl_hoch"
name = "Auswahl einen Eintrag nach oben"
tasten = ["up"]

[[funktion]]
id = "auswahl_runter"
name = "Auswahl einen Eintrag nach unten"
tasten = ["down"]

[[funktion]]
id = "seite_hoch"
name = "Auswahl eine Bildschirmseite nach oben"
tasten = ["pageup"]

[[funktion]]
id = "seite_runter"
name = "Auswahl eine Bildschirmseite nach unten"
tasten = ["pagedown"]

[[funktion]]
id = "listenanfang"
name = "An den Anfang der Liste"
tasten = ["home"]

[[funktion]]
id = "listenende"
name = "An das Ende der Liste"
tasten = ["end"]

[[funktion]]
id = "oeffnen"
name = "In den ausgewählten Ordner einsteigen"
tasten = ["right"]

[[funktion]]
id = "ordner_aufwaerts"
name = "In den übergeordneten Ordner"
tasten = ["left", "cmd+up"]
# Zwei Wege mit je eigenem Grund. left ist der Hauptweg aus dem Nutzerentscheid
# vom 260805: eine Ordnernavigation ohne Zusatztaste ist schneller als eine mit,
# und die Seitwaertspfeile zeigen dabei die Richtung, in der die Ordner
# nebeneinander liegen; right steigt gegenlaeufig ein. Bis zum 260805 lagen
# beide Wege auf cmd+left und cmd+right, seit dem 260804 mit derselben Richtung
# und einer Zusatztaste davor; die Zusatztaste faellt ersatzlos weg. cmd+up legt
# der Finder auf denselben Aufstieg, und der Nutzer hat es am 260804
# ausdruecklich als Finder-Gewohnheit gewollt; es bleibt deshalb stehen.

[[funktion]]
id = "pfadeingabe"
name = "Pfad eingeben und dorthin springen"
tasten = ["shift+cmd+g"]
# Der Finder legt "Gehe zum Ordner" auf dieselbe Kombination.

# ── C2: Mehrfachauswahl ──────────────────────────────────────────────────────

[[funktion]]
id = "markierung_umschalten"
name = "Eintrag markieren und zum nächsten rücken"
tasten = ["space"]

[[funktion]]
id = "alle_markieren"
name = "Alle Einträge markieren"
tasten = ["cmd+a"]

[[funktion]]
id = "markierung_aufheben"
name = "Jede Markierung aufheben"
tasten = ["shift+cmd+a"]

[[funktion]]
id = "markierung_umkehren"
name = "Markierung umkehren"
tasten = ["shift+cmd+i"]

# ── C2: Sortierung und Sichtbarkeit der Einträge ─────────────────────────────
# Die vier Sortierkriterien liegen auf cmd und der Nummer der Spalte, die
# Richtung auf einer eigenen Kombination.

[[funktion]]
id = "sortierung_name"
name = "Nach Name sortieren"
tasten = ["cmd+1"]

[[funktion]]
id = "sortierung_groesse"
name = "Nach Größe sortieren"
tasten = ["cmd+2"]

[[funktion]]
id = "sortierung_datum"
name = "Nach Änderungsdatum sortieren"
tasten = ["cmd+3"]

[[funktion]]
id = "sortierung_typ"
name = "Nach Typ sortieren"
tasten = ["cmd+4"]

[[funktion]]
id = "sortierrichtung_umkehren"
name = "Sortierrichtung umkehren"
tasten = ["cmd+r"]

[[funktion]]
id = "versteckte_umschalten"
name = "Versteckte Dateien ein- und ausblenden"
tasten = ["shift+cmd+h"]
# Der Finder legt das auf cmd+shift+Punkt. Die Schreibweise dieser Datei kennt
# keinen Namen fuer die Punkt-Taste, deshalb steht hier h wie "hidden".

# ── C4: Dateioperationen ausserhalb der Norton-Reihe ─────────────────────────

[[funktion]]
id = "datei_anlegen"
name = "Leere Datei anlegen"
tasten = ["ctrl+cmd+n"]
# Parallel zu shift+cmd+n fuer den neuen Ordner.

[[funktion]]
id = "umbenennen"
name = "Umbenennen"
tasten = ["shift+f6", "shift+cmd+u"]
# Die Norton-Reihe legt das Umbenennen neben das Verschieben auf F6; die
# Umschalttaste trennt die beiden. C3 belegt F6 selbst mit dem Verschieben.

[[funktion]]
id = "umbenennen_stapel"
name = "Im Stapel umbenennen"
tasten = ["ctrl+cmd+u"]

[[funktion]]
id = "abbrechen"
name = "Laufende Operation abbrechen"
tasten = ["esc"]

# ── C5: Lesezeichen- und Geräteleiste ────────────────────────────────────────
# Loeschen und Umbenennen tragen hier eigene Kombinationen, weil delete und
# shift+f6 nach C4 nur im Dateifenster wirken.

[[funktion]]
id = "lesezeichen_anlegen"
name = "Lesezeichen anlegen"
tasten = ["cmd+d"]
# Ein Befehl, zwei Sorten. Mit dem Fokus im Dateifenster merkt er den
# angezeigten Ordner, mit dem Fokus im Editor die Zeile der Schreibmarke als
# Textmarke (C6 der Editor-Runde). Die Beschriftung hiess bis dahin "Ordner als
# Lesezeichen anlegen" und nennt seither keine der beiden Sorten mehr, weil sie
# beide meint. Ein zweiter Anlegebefehl daneben waere der zweite Mechanismus
# fuer dieselbe Aufgabe; die Leiste fuehrt beide Sorten in einer Liste.

[[funktion]]
id = "lesezeichen_umbenennen"
name = "Lesezeichen umbenennen"
tasten = ["ctrl+u"]

[[funktion]]
id = "lesezeichen_loeschen"
name = "Lesezeichen löschen"
tasten = ["ctrl+delete"]

[[funktion]]
id = "lesezeichen_hoch"
name = "Lesezeichen nach oben verschieben"
tasten = ["opt+up"]

[[funktion]]
id = "lesezeichen_runter"
name = "Lesezeichen nach unten verschieben"
tasten = ["opt+down"]

[[funktion]]
id = "fokus_leiste"
name = "Fokus in die Lesezeichen- und Geräteleiste"
tasten = ["shift+cmd+l"]

[[funktion]]
id = "fokus_dateifenster"
name = "Fokus zurück in das Dateifenster"
tasten = ["shift+cmd+d"]

[[funktion]]
id = "fokus_vorschau"
name = "Fokus in das Vorschaufenster"
tasten = ["shift+cmd+y"]
# Der dritte Fokusbefehl. Er steht hier bei den beiden anderen und nicht unten
# bei C7, weil dieser Block die Fokusbefehle fuehrt und nicht die Vorschau; das
# Ein- und Ausblenden der Vorschau steht weiterhin bei "vorschau_umschalten".
#
# Der Buchstabe ist nicht frei gewaehlt: die Vorschau traegt in dieser Belegung
# schon das y, denn cmd+y blendet sie ein und aus, und der Fokusbefehl erbt
# ihn, wie l und d es fuer die Leiste und das Dateifenster tun. shift+cmd+v
# waere der naheliegende Buchstabe gewesen und liegt seit S9 beim Verschieben
# (F6). Nutzerentscheid vom 260807, `decisions/
# 260805-2216_*_tastenweg-des-fokus-in-das-vorschaufenster.md`.

# ── C7: Sichtbarkeit und Breiten der Bereiche ────────────────────────────────
# Das Ein- und Ausblenden der Vorschau steht oben bei "vorschau_umschalten":
# C7 nennt es ausdruecklich dieselbe Funktion wie "Vorschau anzeigen" aus C3.

[[funktion]]
id = "leiste_umschalten"
name = "Lesezeichen- und Geräteleiste ein- und ausblenden"
tasten = ["opt+cmd+l"]

[[funktion]]
id = "zweites_fenster_umschalten"
name = "Zweites Dateifenster ein- und ausblenden"
tasten = ["opt+cmd+d"]

[[funktion]]
id = "fenster_einblenden"
name = "Fenster einblenden"
tasten = ["cmd+n"]
# Der Rueckweg, nachdem das Fenster geschlossen wurde. KRK haelt in dieser
# Runde genau ein Anwendungsfenster; der Eintrag legt deshalb kein neues an,
# sondern holt das vorhandene wieder nach vorn. Darum "Fenster einblenden" und
# nicht "Neues Fenster" (C7).

[[funktion]]
id = "fenster_schliessen"
name = "Fenster schließen"
tasten = ["shift+cmd+w"]
# Das Gegenstueck zum Eintrag darueber und nach demselben Muster gebaut: eine
# gewoehnliche Funktion mit einem Kommando, das am Anwendungsdelegierten
# haengt. Der Menueintrag zeigt das Kuerzel an und nimmt es ab S13c von hier;
# ausgeloest wird die Funktion im Alltag ueber den Ereignisabgriff. Sie traegt
# deshalb kein `gehalten_von`.
#
# cmd+w schliesst den aktiven Tab aus C1 und nicht das Fenster; zwei Funktionen
# auf einer Kombination schliesst C3 aus. Darum shift+cmd+w (C7).

[[funktion]]
id = "bereich_verbreitern"
name = "Aktiven Bereich verbreitern"
tasten = ["ctrl+right"]

[[funktion]]
id = "bereich_verschmaelern"
name = "Aktiven Bereich verschmälern"
tasten = ["ctrl+left"]

# ── C10: die Zwischenablage als Quelle ───────────────────────────────────────
# Beide Funktionen lesen die Zwischenablage des Systems; KRK schreibt sie in
# keinem Fall. Die eine zeigt ihren Inhalt im Vorschaufenster an und blendet
# es dafuer ein, falls es ausgeblendet ist. Die andere deutet den Inhalt als
# Ziel: ein absoluter lokaler Pfad fuehrt zum Sprung dorthin, eine http- oder
# https-Adresse geht an den Systembrowser, alles andere meldet die
# Statuszeile als nicht verwertbar.
#
# Gelesen werden Text und Dateiverweis: ein Pfad oder eine URL als Text, und
# der Dateiverweis, den der Finder bei Cmd+C auf einer Datei ablegt
# (Nutzerentscheid 260804,
# `decisions/260804-0830_*_was-die-zwischenablage-auswertung-liest.md`).
#
# Cmd+C und Cmd+V bleiben von C10 unberuehrt: C10 liest nur, was schon in der
# Zwischenablage steht, und legt nichts ab. Ab Werk frei sind die beiden seit
# dem 260805 nicht mehr; sie tragen die Textbefehle des Menues "Bearbeiten"
# ganz unten und sonst nichts, und genau das haelt sie fuer die
# Dateizwischenablage einer spaeteren Runde frei (C3, C10).

[[funktion]]
id = "zwischenablage_ansehen"
name = "Zwischenablage ansehen"
tasten = ["shift+f3"]
# F3 zeigt die Vorschau, die Umschalttaste davor wechselt die Quelle.
# Dieselbe Systematik traegt die Belegung schon bei f6 gegen shift+f6.

[[funktion]]
id = "zwischenablage_springen"
name = "Zum Inhalt der Zwischenablage springen"
tasten = ["opt+cmd+g"]
# Steht neben shift+cmd+g, der Pfadeingabe von Hand: dieselbe Handlung mit
# vorausgefuelltem Wert.

# ── C11: das Terminal im angezeigten Ordner ──────────────────────────────────
# KRK uebergibt den Ordner des sichtbaren Tabs an eine fremde Anwendung und
# zeigt selbst keine Terminal-Ausgabe. Welche Anwendung gerufen wird, steht
# nicht hier, sondern als Buendelkennung in `settings.toml`; ausgeliefert wird
# sie mit `resources/default-settings.toml`.

[[funktion]]
id = "terminal_oeffnen"
name = "Ordner im Terminal öffnen"
tasten = ["ctrl+o"]
# Der Weg von Total Commander, wo Ctrl+O die Kommandozeile oeffnet. Der Nutzer
# hat das Vorbild am 260805 als tragenden Grund genannt und shift+cmd+t sowie
# f9 ausdruecklich verworfen (`decisions/
# 260805-1623_*_taste-und-einstellbarkeit-des-terminal-befehls.md`). Es ist die
# einzige Kombination dieser Datei, die einem Vorbild aus Total Commander
# folgt; ctrl ist auf dem Mac die unueblichste der vier Zusatztasten, und genau
# darin liegt hier die Wiedererkennung.
#
# Ein Cmd-Kuerzel daneben traegt die Funktion nicht. Die Zwei-Wege-Regel aus C3
# gilt fuer die sechs Funktionen der Norton-Reihe ganz oben und nicht fuer jede
# Funktion; die vier Funktionen vom 260804 tragen aus demselben Grund je eine.

# ── Pfade kopieren und mit dem Standardprogramm öffnen ───────────────────────
# Drei Funktionen der Runde 4. Sie stehen neben C11, weil sie dieselbe Sorte
# Handlung sind: KRK gibt den angezeigten Ordner oder die betroffenen Eintraege
# an etwas ausserhalb der Liste weiter und zeigt selbst nichts davon. Die drei
# Kombinationen sind der Nutzerentscheid vom 260811-1505 (`decisions/
# 260811-1300_*_welche-vier-kombinationen-gelten-ab-werk.md`, Moeglichkeit 1).
# Cmd+W steht nicht hier: es ist eine bestehende Belegung, deren Wirkungsbereich
# dieselbe Runde erweitert, und keine neue Kombination.

[[funktion]]
id = "ordnerpfad_kopieren"
name = "Pfad des angezeigten Ordners kopieren"
tasten = ["opt+cmd+c"]
# Der Preis dieser Kombination ist benannt und angenommen: der Finder legt
# Opt+Cmd+C als "Pfadname kopieren" auf den **Eintrag**, hier meint sie den
# angezeigten Ordner. Wer beides nebeneinander benutzt, vertauscht sie leicht.
# Der Nutzer hat sie am 260811-1505 trotzdem gewaehlt, weil die Verwandtschaft
# zu shift+cmd+c darunter schwerer wiegt als die Naehe zum Finder: beide
# kopieren einen Pfad, und die Zusatztaste unterscheidet, welchen.

[[funktion]]
id = "eintragspfad_kopieren"
name = "Pfad des Eintrags kopieren"
tasten = ["shift+cmd+c"]
# Das Vorbild ist ForkLift, wo Shift+Cmd+C den Pfad des Eintrags kopiert. Es ist
# damit die einzige Kombination dieser Datei, die einem Vorbild aus ForkLift
# folgt, so wie ctrl+o oben dem aus Total Commander folgt.
#
# Cmd+C bleibt unangetastet und traegt weiter allein den Textbefehl des Menues
# "Bearbeiten". Die dritte Moeglichkeit des Datensatzes haette es nach dem
# Vorbild von Cmd+A mit einem zweiten Zusteller belegt; sie ist verworfen,
# solange nicht gemessen ist, ob der Fokusvorbehalt dort so trennt wie bei
# Cmd+A.

[[funktion]]
id = "mit_standardprogramm_oeffnen"
name = "Mit dem Standardprogramm öffnen"
tasten = ["return"]
# Die Gewohnheit aus Norton Commander und dem Finder. Die Eingabetaste war seit
# der Runde 1 ab Werk frei gehalten und vom Nutzer in C2 ausdruecklich fuer
# diesen Zweck freigegeben. Frei bleibt ab Werk damit allein Umschalt+Entf.
#
# Ein Blatt faengt die Taste weiterhin ab, bevor sie hier ankommt: bei stehender
# Nachfrage weist der Anwendungsdelegierte jeden Befehl ausser dem Abbruch ab,
# und der Tastendruck laeuft unveraendert an AppKit weiter, wo ihn die
# Vorgabeschaltflaeche beantwortet.

# ── Der eingebaute Editor ────────────────────────────────────────────────────
# Elf Funktionen der Editor-Runde. Der Einstieg ueber F4 steht oben in der
# Norton-Reihe, wo er seit der Runde 1 reserviert war.
#
# Vier von ihnen teilen sich den Buchstaben e und unterscheiden sich in der
# Zusatztaste. Das ist die Systematik, die diese Belegung schon bei l und d
# faehrt: die blanke Cmd-Ebene traegt die Handlung selbst, shift+cmd den
# Fokusbefehl, opt+cmd das Ein- und Ausblenden, ctrl+cmd die Zweitform.
#
# Ein einbuchstabiger Tastenname in dieser Datei benennt die **Aufschrift** und
# keine Stelle auf der Tastatur: Buchstaben und Ziffern werden ueber das
# gemeldete Zeichen nachgeschlagen, alles uebrige ueber den virtuellen
# Tastencode. Warum es zwei Nachschlagarten sind, steht genau einmal
# ausgeschrieben, im Modulkopf von `crates/krk-core/src/tasten/parser.rs`,
# Abschnitt "Zwei Nachschlagarten, und warum es zwei sein muessen".
# Nutzerentscheid vom 260808-0155,
# `circles/260807-2116-eingebauter-editor-mit-textmarken/decisions/
# 260808-0140_*_die-y-tasten-liegen-auf-einer-deutschen-tastatur-unter-anderen-buchstaben.md`.
#
# Fuer die Eintraege hier folgt daraus: kein Eintrag wandert mit der
# Tastaturbelegung, und keiner meidet einen Buchstaben. Die elf benutzen e, s,
# f, g, j und r; das folgt der Systematik oben und keiner Einschraenkung auf
# bestimmte Buchstaben. Bis zum 260810 stand an dieser Stelle eine Meidung von
# y und z. Sie hatte ihren Grund darin, dass der Ereignisabgriff auch
# Buchstaben ueber die Stelle nachschlug, und ist seit S2 gegenstandslos.

[[funktion]]
id = "editor_aus_vorschau"
name = "Im Editor bearbeiten"
tasten = ["cmd+e"]
# Der zweite Einstiegsweg: die im Vorschaufenster angezeigte Datei in den
# Editor uebernehmen (Nutzerentscheid vom 260807-2139). e wie Editor, und die
# blanke Cmd-Ebene traegt die Handlung selbst, so wie cmd+y die Vorschau ein-
# und ausblendet und cmd+d ein Lesezeichen anlegt.

[[funktion]]
id = "fokus_editor"
name = "Fokus in den Editor"
tasten = ["shift+cmd+e"]
# Der vierte Fokusbefehl. Die Familie steht seit der Runde 1 auf
# shift+cmd+<Buchstabe>: shift+cmd+l fuer die Leiste, shift+cmd+d fuer das
# Dateifenster, shift+cmd+y fuer die Vorschau.

[[funktion]]
id = "editor_schliessen"
name = "Editor schließen"
tasten = ["opt+cmd+e"]
# Die Umschaltfamilie steht auf opt+cmd+<Buchstabe>: opt+cmd+l fuer die Leiste,
# opt+cmd+d fuer das zweite Dateifenster. Das Schliessen des Editors ist die
# Ausblendhaelfte dieser Familie; die Einblendhaelfte tragen F4 und der
# Uebergang aus der Vorschau, weil beide zugleich eine Datei mitbringen.

[[funktion]]
id = "editor_ansicht_umschalten"
name = "Zwischen Roh- und Formatansicht wechseln"
tasten = ["ctrl+cmd+e"]
# Die vierte Ebene derselben e-Familie. ctrl+cmd traegt in dieser Belegung
# schon die Zweitform einer Handlung: ctrl+cmd+u neben shift+cmd+u, ctrl+cmd+n
# neben shift+cmd+n.

[[funktion]]
id = "editor_sichern"
name = "Sichern"
tasten = ["cmd+s"]
# Der Mac-Standard, und ab Werk frei.

[[funktion]]
id = "editor_zeile_springen"
name = "Zu Zeile springen"
tasten = ["cmd+j"]
# BBEdit legt "Gehe zu Zeile" auf dieselbe Kombination. cmd+l waere der naehere
# Buchstabe und bleibt frei, weil die l-Familie in dieser Belegung der
# Lesezeichenleiste gehoert.

[[funktion]]
id = "editor_suchen"
name = "Im Text suchen"
tasten = ["cmd+f"]
# Der Mac-Standard.

[[funktion]]
id = "editor_weitersuchen"
name = "Weitersuchen"
tasten = ["cmd+g"]
# Der Mac-Standard.

[[funktion]]
id = "editor_rueckwaerts_suchen"
name = "Rückwärts weitersuchen"
tasten = ["ctrl+cmd+g"]
# Der Mac-Standard waere shift+cmd+g, und der traegt seit der Runde 1 die
# Pfadeingabe, weil der Finder "Gehe zum Ordner" dorthin legt. Zwei Funktionen
# auf einer Kombination bei demselben Zusteller schliesst C3 aus. ctrl+cmd+g
# steht bei opt+cmd+g, dem Sprung zum Inhalt der Zwischenablage.

[[funktion]]
id = "editor_ersetzen"
name = "Ersetzen"
tasten = ["shift+cmd+r"]
# cmd+r traegt die Sortierrichtung. r wie "replace"; die Belegung nimmt an
# mehreren Stellen den englischen Anfangsbuchstaben, wo der deutsche belegt ist.

[[funktion]]
id = "editor_alle_ersetzen"
name = "Alle ersetzen"
tasten = ["ctrl+cmd+r"]
# Dieselbe Systematik wie "umbenennen" gegen "umbenennen_stapel": die
# Einzelform auf shift+cmd, die Stapelform auf ctrl+cmd.

# ── C3: die Belegungsansicht ─────────────────────────────────────────────────

[[funktion]]
id = "belegung_ansehen"
name = "Tastaturbelegung anzeigen"
tasten = ["f1"]
# Das Vorbild ist die Norton-Reihe, wo F1 die Hilfe traegt; fuer eine
# Anwendung mit der Tastatursteuerung als erster Maxime ist die
# Belegungsansicht genau das. Auf dem Mac ist F1 keine Hilfetaste, sondern die
# Verringerung der Bildschirmhelligkeit; hier weicht die Belegung vom Mac ab,
# anders als bei den sechs Cmd-Kuerzeln der Norton-Reihe oben. Die Ansicht
# dahinter entsteht spaeter in dieser Runde; bis dahin loest die Taste nichts
# aus und nimmt dem System das Ereignis nicht weg (C3).

# ── C2: die Textbefehle des Menüs "Bearbeiten" ───────────────────────────────
# Diese Funktionen fuehrt KRK nicht aus, und sie bekommen nie ein Kommando.
# Zugestellt werden sie vom Menue "Bearbeiten": ein NSMenuItem traegt die
# Kombination, und die Antwortkette entscheidet, wer sie beantwortet. Im
# Textfeld ist das der Feldeditor von AppKit, im Dateifenster heute niemand,
# weshalb der Eintrag dort grau ist. Genau dieser Punkt ist spaeter der
# Einhaengepunkt der Dateizwischenablage: wer `copy:` und `paste:` am
# Dateifenster beantwortet, hat sie, ohne einen zweiten Menueintrag und ohne
# eine zweite Zeile in dieser Datei.
#
# Sie stehen hier, weil C3 zusagt, dass jede Kombination, die in KRK etwas
# ausloest, in der Belegung steht, von der Konflikterkennung gesehen wird und
# umbelegbar ist. Ohne diese Eintraege waeren es vier Kuerzel, die keine der
# drei Zusagen erreicht. Nutzerentscheid vom 260805-0000, `decisions/
# 260805-0000_*_menuekuerzel-in-die-konflikterkennung-oder-daneben.md`.
#
# Das Menue ist zugleich der Grund, aus dem ein Textfeld ueberhaupt etwas
# eingefuegt bekommt: auf dem Mac liegen diese Befehle nicht im Textsystem,
# sondern als Menuekuerzel. C2 sagt fuer die Pfadeingabe ausdruecklich zu, dass
# der Nutzer einen Pfad einfuegen kann.
#
# **Genau daran haengt das Rueckgaengig des Editors.** Die Textflaeche bringt
# einen Rueckgaengigverwalter mit, aber `undo:` und `redo:` liegen auf dem Mac
# ebenfalls nicht im Textsystem, sondern als Menuekuerzel: ohne die beiden
# Eintraege "text_rueckgaengig" und "text_wiederholen" unten haette der Editor
# kein Rueckgaengig, und das waere ein Editor, den niemand benutzt.
#
# Die beiden sind die einzigen Kombinationen dieser Runde auf dem Buchstaben z,
# und das ist unauffaellig: einen Buchstaben schlagen **beide** Zusteller ueber
# das **Zeichen** nach. Das Menue tut es ueber `NSMenuItem.keyEquivalent`, das
# eine Zeichenkette entgegennimmt (`crates/krk-ui/src/appkit/menue.rs`,
# `zeichen_der_taste`), der Ereignisabgriff seit S2 ueber das Zeichen, das das
# Ereignis meldet (`Kombination::aus_tastendruck` in
# `crates/krk-core/src/tasten/parser.rs`). Cmd+Z wirkt deshalb auf jeder
# Tastaturbelegung an der beschrifteten Stelle, und cmd+c und cmd+v tun es aus
# demselben Grund.
#
# Bis zum 260810 leitete dieser Block die Wirkung aus dem Zusteller ab: nur das
# Menue schlage ueber das Zeichen nach, der Ereignisabgriff ueber die Stelle.
# Seit S2 gilt es fuer beide, und die Ableitung ist weggefallen; das Ergebnis
# bleibt.
#
# Was hier steht, ist die Anzeige- und Konfliktseite dieser Kuerzel und nicht
# der Nachschlag, der sie ausloest.

[[funktion]]
id = "text_ausschneiden"
name = "Ausschneiden"
tasten = ["cmd+x"]
gehalten_von = "menue"

[[funktion]]
id = "text_kopieren"
name = "Kopieren"
tasten = ["cmd+c"]
gehalten_von = "menue"

[[funktion]]
id = "text_einfuegen"
name = "Einfügen"
tasten = ["cmd+v"]
gehalten_von = "menue"

# cmd+a steht auch bei "alle_markieren" weiter oben, und das ist kein Konflikt.
# Dort stellt der Ereignisabgriff zu, hier das Menue, und der Fokusvorbehalt
# laesst die beiden einander nie begegnen: in der Liste markiert cmd+a alle
# Eintraege, im Eingabefeld waehlt es den Text aus, wie auf dem Mac ueblich
# (Nutzerentscheid vom 260805, `decisions/
# 260805-0713_*_ist-eine-kombination-bei-zwei-zustellern-ein-konflikt.md`).

[[funktion]]
id = "text_alles_auswaehlen"
name = "Alles auswählen"
tasten = ["cmd+a"]
gehalten_von = "menue"

[[funktion]]
id = "text_rueckgaengig"
name = "Rückgängig"
tasten = ["cmd+z"]
gehalten_von = "menue"
# Der Mac-Standard. Im Editor beantwortet der Rueckgaengigverwalter der
# Textflaeche das Kuerzel, in einem Textfeld der Feldeditor; KRK fuehrt es in
# keinem Fall selbst aus.

[[funktion]]
id = "text_wiederholen"
name = "Wiederholen"
tasten = ["shift+cmd+z"]
gehalten_von = "menue"
# Das Gegenstueck, ebenfalls der Mac-Standard.

# ── C3: das Beenden der Anwendung ────────────────────────────────────────────

[[funktion]]
id = "beenden"
name = "KRK beenden"
tasten = ["cmd+q"]
# Der sechste und letzte Eintrag des Hauptmenues. C3 sagt zu, dass jede
# Kombination, die in KRK etwas ausloest, in der Belegung steht, von der
# Konflikterkennung gesehen wird und umbelegbar ist. Cmd+Q beendet die
# Anwendung und erreichte bis zum 260805 keine der drei Zusagen: S13b hat fuenf
# Menuekuerzel nachgetragen und dieses uebersehen (`issues/
# 260805-0753_*_cmd-q-loest-etwas-aus-und-steht-in-keiner-tastenliste.md`).
#
# Gebaut wie "fenster_schliessen" weiter oben und nicht wie die vier
# Textbefehle darueber: eine gewoehnliche Funktion, deren Kommando am
# Anwendungsdelegierten haengt. Der Menueeintrag zeigt das Kuerzel an und nimmt
# es von hier; ausgeloest wird die Funktion im Alltag ueber den
# Ereignisabgriff. Sie traegt deshalb kein `gehalten_von`.
#
# Der eigene Selektor am Delegierten ist zugleich das Mittel gegen die
# Zweitform "Quit and Keep Windows" auf Opt+Cmd+Q, die AppKit zu `terminate:`
# dazustellt, so wie `fensterSchliessen:` es gegen "Close All" war (`issues/
# 260805-0753_*_macos-stellt-zu-terminate-eine-zweitform-quit-and-keep-windows-auf-opt-cmd-q.md`).
# Solange er noch nicht steht, traegt die Funktion kein Kommando, wie
# "belegung_ansehen" oben: der Ereignisabgriff schluckt Cmd+Q dann nicht,
# sondern reicht es an das Menue weiter, und die Anwendung beendet sich
# unveraendert.
