# KRK — Auslieferungsfassung der Einstellungen
#
# Diese Datei ist die alleinige Quelle der ausgelieferten Einstellungen. Die
# Ablage aus Schritt 18c des Plans bindet sie ueber `include_str!` ein und legt
# `~/Library/Application Support/KRK/settings.toml` beim ersten Start aus ihr
# an, samt dieser Kommentare. Danach ist sie die eine Datei der Ablage, die von
# Hand gepflegt wird, und KRK schreibt sie an genau einer Stelle: "Ort
# waehlen..." im Menue "Home" ersetzt allein den Wert von `notizordner` und
# laesst jedes andere Byte stehen, diese Kommentare eingeschlossen. Ist die
# Datei ein symbolischer Verweis, schreibt KRK sie nie und nennt die Zeile zum
# Eintragen von Hand.
#
# Quelle: Spec `260802-1036_*_spec-navigator-geruest.md`, Faehigkeit C11.
# Bindend ist ausserdem der Datensatz
# `decisions/260805-1623_*_taste-und-einstellbarkeit-des-terminal-befehls.md`.
#
# Aufnahmeregel: hier steht ein Wert, der zwei Bedingungen zugleich erfuellt.
# Er ist keine Tastenbelegung, und KRK schreibt ihn im Betrieb nicht selbst
# fort. Eine Ansicht darf er haben, wenn ihr Schreibweg allein die Zeile dieses
# Werts beruehrt; `notizordner` ist der erste solche Wert. Was KRK selbst
# fortschreibt, gehoert
# nach `session.toml`: eine Fensterbreite, eine Sortierung, eine zuletzt
# besuchte Stelle aendern sich beim Arbeiten und nicht beim Einrichten. Eine
# Tastenbelegung gehoert nach `keymap.toml`, schon weil der Befehl aus C3, der
# die gesamte Belegung zuruecksetzt, sonst eine Einstellung mit zuruecksetzte.
# Und eine Ansicht, deren Schreibweg die ganze Datei neu schriebe, gehoert
# nicht hierher: sie loeschte die Kommentare, die den Sinn dieser Datei
# ausmachen. Die Herleitung steht im Plan unter `### Frage 4`, die Neufassung im
# Spec `260926-1451_*_spec-home-menue-und-einstellbarer-ort.md`.
#
# Ein Feld, das die Nutzerdatei nicht nennt, kommt aus dieser Fassung. Das ist
# die eine Abweichung von `keymap.toml`, wo die Nutzerdatei die
# Auslieferungsbelegung vollstaendig ersetzt statt sie zu ergaenzen.

# Die Anwendung, die "Ordner im Terminal öffnen" ruft, ab Werk Ctrl+O (C11).
#
# Der Wert ist eine Buendelkennung und kein Pfad, und ein Pfad ist keine
# zulaessige zweite Form. Eine Kennung ueberlebt, was ein Pfad nicht ueberlebt:
# das Verschieben der Anwendung, ihr Umbenennen und ihren Ersatz durch eine
# neuere Fassung. Terminal.app selbst ist der Fall, sie liegt seit macOS
# Catalina unter `/System/Applications/Utilities/` und davor unter
# `/Applications/Utilities/`.
#
# Die Kennung einer installierten Anwendung liest dieses Kommando aus:
#
#   mdls -name kMDItemCFBundleIdentifier -raw /Applications/<Name>.app
#
# Geprueft sind am 260805-1623 genau zwei Kennungen, und weitere nennt diese
# Datei nicht: `com.apple.Terminal` fuer Terminal.app unter
# /System/Applications/Utilities/ und `com.mitchellh.ghostty` fuer Ghostty.app
# unter /Applications/. Eine ungeprueft hingeschriebene Kennung saehe geprueft
# aus und schickte den Leser in die Irre, waehrend das Kommando darueber ihn in
# einem Zug zu der Kennung fuehrt, die auf seinem Geraet gilt.
#
# Die eingestellte Anwendung muss Ordner annehmen. Erkennbar ist das an
# `public.directory` unter `CFBundleDocumentTypes` in ihrer
# Buendelbeschreibung; die beiden oben genannten fuehren es. Eine Anwendung
# ohne diesen Eintrag startet auf den Befehl hin, ohne in den Ordner zu
# wechseln, und KRK kann den Unterschied nicht feststellen (C11).
terminal = "com.apple.Terminal"

# Der Notizordner, den F2 und cmd+k oeffnen: dort liegen notes.txt, tasks.txt
# und secrets.txt (Datensatz
# `260926-1447_*_bekommt-krkhome-ein-eigenes-menue-und-einen-einstellbaren-ort.md`).
#
# Der Wert beginnt mit `~/` fuer das Benutzerverzeichnis oder mit `/`; ein
# relativer oder leerer Wert ist unzulaessig. KRK setzt dann keinen Ersatzort
# ein, und F2 nennt den Grund in der Statuszeile. Der Ablageordner von KRK
# (`~/Library/Application Support/KRK/`) ist als Ort ausgeschlossen, weil ein
# Werkzeug, das eine Anwendung samt Stuetzdateien entfernt, ihn mitnimmt.
#
# Ein geteiltes Verzeichnis ist der Anlass fuer diesen Schluessel, etwa
#
#   notizordner = "~/Dropbox/krkhome"
#
# und dann liegt eine Kopie von secrets.txt auch beim Anbieter: verschluesselt,
# aber mit einer vierstelligen PIN.
#
# Ein Wechsel verschiebt nichts. Die Dateien am alten Ort bleiben liegen, und
# was am neuen Ort fehlt, legt erst der naechste F2 dort leer an; beim Start
# legt KRK nie etwas an. Gesetzt wird der Wert von Hand hier, dann gilt er ab
# dem naechsten Start und die Statuszeile nennt einmal den alten Ort, oder ueber
# "Ort waehlen..." im Menue "Home", dann gilt er sofort. Die
# alten Notizzettel aus der Zeit vor dem Notizordner werden allein am
# Vorgabeort `~/krkhome` uebernommen und nirgends sonst.
#
# Ist diese Datei beschaedigt oder nicht lesbar, gilt kein Notizordner, bis
# sie berichtigt und KRK neu gestartet ist oder bis "Ort waehlen..." sie nach
# dem Berichtigen neu liest und den Wert schreibt (Datensatz
# `260926-1506_*_welcher-notizordner-gilt-wenn-settings-toml-beim-start-beschaedigt-ist.md`).
#
# Eine KRK-Fassung vor diesem Schluessel weist eine Datei, die ihn fuehrt, als
# beschaedigt ab, laesst sie liegen und arbeitet mit ihren Vorgaben weiter.
notizordner = "~/krkhome"
