# KRK — Auslieferungsfassung der Leseprofile
#
# Diese Datei ist die alleinige Quelle der ausgelieferten Leseprofile. KRK
# bindet sie über `include_str!` ein und legt
# `~/Library/Application Support/KRK/readers.toml` beim ersten Start wörtlich
# aus ihr an, samt dieser Kommentare. Danach schreibt KRK die Nutzerdatei nicht
# mehr: sie ist neben `settings.toml` die zweite Datei, die KRK nach ihrer
# Anlage nie wieder überschreibt.
#
# Quelle: Spec `260824-0613_*_spec-vorschau-zeigt-profil-zusammenfassung-statt-
# metadaten.md`, Fähigkeit C5. Bindend ist außerdem der Datensatz
# `decisions/260823-2208_*_liefert-krk-ein-fertiges-fusion-workbench-profil-
# mit.md`.
#
# Wozu ein Profil da ist: Wählt man im Dateifenster einen Ordner aus, zeigt das
# Vorschaufenster sonst seine Metadaten, also Größe, Änderungsdatum, Rechte und
# Typ. Trifft ein Profil auf diesen Ordner zu, stehen dort stattdessen die
# Zeilen des Profils. Trifft keines zu, bleibt die Metadatenanzeige, wie sie
# war.
#
# Die Profile unten beschreiben zwei Werkbänke. Die von fusion, das seine
# Arbeit in Runden schneidet und den Stand jedes Datensatzes als Marker im
# Dateinamen trägt, und die von flight, das dieselben Arten von Datensätzen
# flach an der Wurzel führt und keine Marker kennt. Wer mit keinem von beiden
# arbeitet, kann alle Profile ersetzen und verliert nichts.
#
# Geändert wird die Datei bei ausgeschaltetem KRK, oder die Änderung wirkt erst
# beim nächsten Start: KRK liest sie einmal und beobachtet sie nicht.

# ----------------------------------------------------------------------------
# Was ein Schreibfehler kostet
# ----------------------------------------------------------------------------
#
# Ein verschriebener Schlüssel in einem Baustein kostet nicht die eine Zeile,
# sondern die GANZE DATEI. Sie gilt dann als beschädigt, KRK legt sie beiseite
# und arbeitet ohne jedes Profil weiter; die Meldung darüber steht beim Start in
# der Statuszeile und nennt den Schlüssel. Wer `zahlung` statt `zaehlung` oder
# `feldmusster` statt `feldmuster` schreibt, verliert also jede Zusammenfassung
# dieser Datei und nicht bloß eine Zeile.
#
# Drei Reichweiten gibt es, und diese ist die weiteste:
#
#   1. Die ganze Datei fällt weg — ein unbekannter Schlüssel an der obersten
#      Ebene, in einer `[[profil.zeile]]` oder in einem Bausteintisch, ein
#      Tischname, den es nicht gibt, ein Wert für `zeigt`, den es nicht gibt,
#      ein fehlender `name`, oder sonst etwas, das nicht in die erwartete
#      Gestalt passt.
#   2. Ein ganzes Profil fällt weg — sein `pfad` oder sein `kennzeichen` lässt
#      sich nicht als Ausdruck übersetzen, oder es nennt keines von beiden. Die
#      übrigen Profile bleiben.
#   3. Eine Zeile verliert ihren Baustein und behält ihre Beschriftung — sie
#      nennt nicht genau einen der vier Bausteine, ein Muster darin lässt sich
#      nicht übersetzen, das `feldmuster` trägt nicht genau eine Fanggruppe,
#      oder der `ordner` taugt nicht: er trägt ein leeres Stück (etwa durch
#      einen abschließenden Schrägstrich), führt aus dem erkannten Ordner
#      heraus, trägt mehr als einen Platzhalter, oder einen Platzhalter an
#      einem Baustein, der keinen annimmt. Die Zeile zeigt dann ihre
#      Beschriftung und den Platzhalter `--`, die übrigen Zeilen stimmen
#      weiter.
#
# Der `[[profil]]`-Block selbst ist die eine Stelle, an der ein unbekannter
# Schlüssel NICHT gemeldet, sondern übergangen wird. Was er kostet, ist das,
# was der Schreibfehler weggenommen hat: `kennzeichnen` statt `kennzeichen`
# nimmt dem Profil sein Erkennungsmuster, und es fällt in die zweite Reichweite
# oder greift, steht ein `pfad` daneben, still über diesen allein; `zeilen`
# statt `zeile` lässt ein Profil ohne eine einzige Zeile stehen, und das ohne
# jede Meldung.

# ----------------------------------------------------------------------------
# Der Aufbau: Profil, Zeile, genau ein Baustein
# ----------------------------------------------------------------------------
#
# Ein `[[profil]]` trägt einen `name` (er dient allein den Meldungen und wird
# nicht angezeigt), dazu `pfad` oder `kennzeichen` oder beides, und darunter
# beliebig viele `[[profil.zeile]]`.
#
# Eine `[[profil.zeile]]` trägt eine `beschriftung` und GENAU EINEN der vier
# Bausteine `zaehlung`, `juengste`, `feld` und `vorhandensein`. Keiner ist zu
# wenig, zwei sind zu viel; beides weist KRK mit einer Meldung ab und die Zeile
# zeigt ihren Platzhalter.
#
# Jedes Muster ist ein regulärer Ausdruck und steht in einfachen
# Anführungszeichen. Das ist in TOML eine wörtliche Zeichenkette: die
# Rückstriche stehen darin so, wie der Ausdruck sie braucht, und sind nicht
# noch einmal zu verdoppeln.
#
# Jeder Baustein darf `ordner` nennen, einen Unterordner des erkannten Ordners.
# Ohne die Angabe ist der erkannte Ordner selbst gemeint. Abgewiesen werden ein
# absoluter Pfad, ein `.`, ein `..` sowie ein doppelter und ein ABSCHLIESSENDER
# Schrägstrich: `ordner = "planning/"` ist keine Verschreibung, sondern eine
# gewöhnliche Schreibgewohnheit, und kostet die Zeile trotzdem ihren Baustein.
# Was aufgelöst doch aus dem Ordner herausführt, wird ebenso abgewiesen: eine
# Zusammenfassung liest nie außerhalb des Ordners, über den sie spricht.

# ----------------------------------------------------------------------------
# Der Platzhalter in der Ortsangabe
# ----------------------------------------------------------------------------
#
# GENAU EIN Stück der Ortsangabe darf `*` sein und lässt damit einen Namen
# offen. `ordner = "*"` meint jeden Unterordner des erkannten Ordners,
# `ordner = "*/issues"` den Unterordner `issues` in jedem von ihnen. Die
# Einträge aller getroffenen Ordner liegen danach in EINER Lesung.
#
# Damit beantwortet eine Zeile eine Frage über den ganzen Bestand einer Ebene
# darunter, ohne dass ihre Kosten mit dem Bestand wachsen: das Verzeichnis
# aller Runden zählt seine Zustände so, gleich ob es zwanzig Runden führt oder
# zweihundert.
#
# Vier Dinge gehören dazu, jedes mit seinem Grund:
#
#   - HÖCHSTENS EINER. Zwei Platzhalter werden beim Laden abgewiesen und
#     kosten die Zeile ihren Baustein, nicht die Datei. Mit einem
#     ist die Form der Kosten aus dem Profil ablesbar — ein Lauf über den
#     Ordner vor dem Platzhalter, dann einer je Treffer —, mit zweien stünde sie
#     erst am Bestand fest.
#   - ER GREIFT ALLEIN ORDNER. Eine Verknüpfung an seiner Stelle wird
#     übergangen, aus demselben Grund, aus dem eine Zusammenfassung nie
#     außerhalb ihres Ordners liest: eine Verknüpfung führt heraus.
#   - `juengste` UND `feld` NEHMEN IHN NICHT AN. Beide lesen Dateien und
#     brauchen dafür deren Pfad, und den trägt eine Lesung nicht mehr, in der
#     die Einträge mehrerer Ordner zusammenliegen. Abgewiesen wird beim Laden;
#     die Zeile behält ihre Beschriftung. Für `juengste` gilt das auch in
#     seiner Datumsform, die gar keine Datei liest — die Grenze steht am
#     Baustein, damit sie an einer Stelle abzulesen bleibt.
#   - EIN STERN IM NAMEN IST EIN NAME. Offen ist der Name nur, wenn das ganze
#     Stück aus dem Stern besteht. Ein Ordner, der `*` heißt, ist als Ort damit
#     nicht mehr benennbar, und das ist der Preis dieser Form.

# ----------------------------------------------------------------------------
# Die vier Bausteine
# ----------------------------------------------------------------------------
#
# `zaehlung` — die Zahl der Einträge, deren Name das Muster erfüllt. Ohne
# `muster` zählt sie alle. Sie zählt flach über eine Ebene und steigt nicht in
# Unterordner ab.
#
#   [[profil.zeile]]
#   beschriftung = "Offene Defekte"
#   zaehlung = { ordner = "issues", muster = '_o_.*\.md$' }
#
# `juengste` — die `anzahl` Einträge mit dem jüngsten Änderungsdatum. Was über
# jeden von ihnen dasteht, sagt `zeigt`:
#
#   `zeigt = "titel"` (die Vorgabe, wenn der Schlüssel fehlt) zeigt den Titel
#   jeder Datei. Der Titel ist ihre erste nicht leere Zeile; ein führendes `#`
#   und die Leerzeichen dahinter fallen weg. Eine leere oder nicht lesbare Datei
#   zeigt ihren Dateinamen. Diese Form ÖFFNET JEDE DATEI und sieht deshalb
#   allein Einträge vom Typ Datei.
#
#   `zeigt = "datum"` zeigt stattdessen das Änderungsdatum in der Form
#   `JJJJ-MM-TT HH:MM`, in bürgerlicher Ortszeit. Diese Form ÖFFNET NICHTS —
#   das Datum steht ohnehin in jedem gelesenen Eintrag — und sieht deshalb
#   Einträge JEDES TYPS. Nur so kann ein Speicher antworten, der Ordner
#   enthält, etwa `archive/`.
#
#   Ein dritter Wert für `zeigt` kostet die ganze Datei, wie jeder Schlüssel,
#   den es nicht gibt.
#
#   [[profil.zeile]]
#   beschriftung = "Die jüngsten zehn"
#   juengste = { ordner = "history", muster = '\.md$', anzahl = 10 }
#
#   [[profil.zeile]]
#   beschriftung = "Zuletzt abgelegt"
#   juengste = { anzahl = 1, zeigt = "datum" }
#
# `feld` — die erste Fanggruppe des ersten Treffers im Inhalt einer Datei.
# `datei` sucht die Datei über ihren Namen, `feldmuster` greift den Wert und
# trägt genau eine Fanggruppe. Wer eine Alternative gruppieren, aber nicht
# fangen will, schreibt `(?:…)`.
#
# Passen mehrere Dateien auf `datei`, gewinnt die erste in der Lesereihenfolge,
# und die gibt das Dateisystem vor: welche davon es wird, ist nicht zugesagt.
# Ein `datei`-Muster gehört deshalb an beiden Enden verankert, wie die unten es
# alle sind.
#
#   [[profil.zeile]]
#   beschriftung = "Fassung"
#   feld = { datei = '^\.fusion-setup$', feldmuster = '"plugin_version":"([^"]*)"' }
#
# `vorhandensein` — ob ein Eintrag das Muster erfüllt. Der Wert ist „ja" oder
# „nein". Es gibt einen dritten Ausgang: gibt es den genannten `ordner` nicht,
# zeigt die Zeile ihren Platzhalter `--` und nicht „nein". „Der Ordner ist da
# und enthält nichts Passendes" und „den Ordner gibt es nicht" sind zwei
# verschiedene Auskünfte, und nur die erste heißt „nein".
#
#   [[profil.zeile]]
#   beschriftung = "Spec"
#   vorhandensein = { ordner = "planning", muster = '_._spec-' }
#
# Zur Verankerung: `datei`, `kennzeichen`, `pfad` und das `muster` der übrigen
# Bausteine laufen gegen einen einzelnen Namen oder einen Pfad, also gegen eine
# einzige Zeile ohne Zeilenende. Das `feldmuster` läuft dagegen über den ganzen
# Dateiinhalt, und dort verankern `^` und `$` am Anfang und Ende der GANZEN
# Eingabe. Wer eine einzelne Zeile darin verankern will, schreibt `(?m)` an den
# Anfang seines Ausdrucks; wer über Zeilengrenzen hinweg greifen will, `(?s)`.

# ----------------------------------------------------------------------------
# Welches Profil gewinnt
# ----------------------------------------------------------------------------
#
# KRK sucht in drei Schritten, und der erste Treffer gewinnt:
#
#   1. Alle Profile in der Reihenfolge dieser Datei, je Profil allein das
#      `pfad`-Muster gegen den vollen Pfad des ausgewählten Ordners.
#   2. Hat kein `pfad` getroffen: alle Profile ein zweites Mal in derselben
#      Reihenfolge, je Profil allein das `kennzeichen` gegen die Namen der
#      Einträge im ausgewählten Ordner.
#   3. Hat auch das nicht getroffen: die gewohnte Metadatenanzeige.
#
# Ein `pfad` geht damit jedem `kennzeichen` vor, gleich wo die beiden Profile in
# dieser Datei stehen. Wer die Rangfolge unter gleichartigen Profilen ändern
# will, verschiebt ihre Blöcke.

# ----------------------------------------------------------------------------
# Was eine Zusammenfassung höchstens kostet
# ----------------------------------------------------------------------------
#
# Damit die Vorschau schnell bleibt, arbeitet eine Zusammenfassung innerhalb
# fester Grenzen:
#
#   höchstens 12 Verzeichnisleseläufe je Zusammenfassung
#   höchstens 24 Dateiöffnungen je Zusammenfassung
#   höchstens 2.000 Einträge je Leselauf
#   höchstens 64 KB je gelesener Datei
#   höchstens 10 bei `anzahl`; eine größere Zahl wird darauf gekappt
#
# EIN ORT KOSTET GENAU EINEN LESELAUF, gleich wie viele Zeilen ihn nennen: der
# erkannte Ordner ebenso wie jeder Unterordner und jeder Platzhalterlauf. Zwei
# Zeilen über `planning` teilen sich also eine Lesung, und die Zahl der
# Leseläufe eines Profils ist die Zahl der VERSCHIEDENEN Orte darin — PLUS
# EINEN LAUF FÜR DIE ERKENNUNG, wenn das Profil über sein `kennzeichen`
# erkannt wurde und keine seiner Zeilen den erkannten Ordner selbst nennt.
# Die Erkennung über ein `kennzeichen` liest die Einträge des ausgewählten
# Ordners, und dieser Lauf ist einer der zwölf; nennt eine Zeile denselben
# Ordner, teilt sie sich die Lesung mit ihm. Ein `pfad` erkennt ohne Lesung
# und kostet nichts. Das Wurzelprofil einer fusion-Werkbank unten kostet
# deshalb drei Läufe, das Projektwurzelprofil mit denselben sieben Zeilen
# vier: dort trägt jede Zeile eine Ortsangabe, und den erkannten Ordner liest
# allein die Erkennung.
#
# Bei den Öffnungen fällt die Wahl anders aus. `feld` kostet genau eine,
# `juengste` mit `zeigt = "titel"` deren `anzahl` und mit `zeigt = "datum"`
# keine; zwei Feldbausteine über derselben Datei öffnen sie zweimal. Ein Ort
# steht als Ortsangabe im Profil und ist vor jeder Lesung bekannt, welche Datei
# ein Baustein öffnet, entscheidet dagegen erst sein Muster an den gelesenen
# Einträgen.
#
# Ein Platzhalterlauf bucht EINEN Leselauf und öffnet dabei so viele
# Verzeichnisse, wie er Treffer hat. Ein Leselauf öffnet damit nicht mehr genau
# ein Verzeichnis; was eine Zusammenfassung an Systemaufrufen wirklich kostet,
# steht erst am Profil UND am Bestand. Begrenzt wird die Arbeit deshalb an den
# gelesenen Einträgen und nicht an den geöffneten Verzeichnissen.
#
# Wird eine der Grenzen erreicht, bricht nichts ab: die übrigen Zeilen zeigen
# ihren Platzhalter `--`. Eine Zählung über 2.000 Einträgen nennt die Zahl der
# gefundenen Treffer und sagt dazu, dass die Lesung abgebrochen wurde.

# ============================================================================
# Die Profile für eine fusion-Werkbank
# ============================================================================

# Die Wurzel einer fusion-Werkbank.
#
# Erkannt wird sie über `.fusion-setup` und nicht über ihren Namen: ein
# Pfadmuster auf `fusion-workbench` träfe jeden Ordner dieses Namens, auch einen
# leeren, während `.fusion-setup` in einer eingerichteten Werkbank steht und
# sonst nirgends.
#
# Die Zeile „Projekt" steht an einer fusion-Werkbank derzeit leer, und das ist
# kein Schreibfehler in dieser Datei: sie zieht den Namen aus dem Feld
# `setup_pwd` von `.fusion-setup`, und fusion schreibt dieses Feld seit einer
# Fassung zwischen 8.1.0 und 10.7.0 nicht mehr. Sie bleibt trotzdem stehen,
# weil eine ältere Werkbank das Feld noch trägt. Umsonst ist sie nicht:
# geteilt wird der Leselauf über einen Ort, nicht die Öffnung einer Datei,
# und jeder Feldbaustein öffnet seine Datei selbst. Die drei Zeilen über
# `.fusion-setup` kosten also drei der vierundzwanzig Öffnungen, und diese
# eine davon. Bei einer flight-Werkbank ganz unten liefert dieselbe Zeile
# weiter einen Wert.
#
# Die Zeile „Sitzung" hängt an einer Zeilenform von `orchestrator-live.md`, die
# fusion ändern kann. Ändert fusion sie, zeigt diese eine Zeile ihren
# Platzhalter, und die sechs übrigen stimmen weiter.
#
# Ihr Muster nimmt die erste Zeile unter `## Current`, die etwas trägt. Es
# überspringt dabei Leerzeilen, hält aber vor der nächsten Überschrift an: ist
# der Abschnitt leer, steht der Platzhalter da und nicht der Name des nächsten
# Abschnitts. Eine Zeile, die selbst mit `#` beginnt, gilt dabei als
# Überschrift und wird nicht gelesen. Ein fehlendes Zeilenende am Dateiende
# kostet den Wert nicht. Das `(?m)^` am Anfang verankert die Überschrift am
# Zeilenanfang, wie der Absatz „Zur Verankerung" oben es verlangt: ohne das
# fingen auch eine Unterüberschrift `### Current` und eine Erwähnung von
# `## Current` mitten im Fließtext, und die Zeile zeigte deren Inhalt statt
# des Platzhalters.
#
# DIESE SIEBEN ZEILEN STEHEN EIN ZWEITES MAL IN DIESER DATEI, nämlich im Profil
# „Projektwurzel mit fusion-Werkbank" ganz unten, dort jede mit
# `fusion-workbench/` vor der Ortsangabe. Wer hier eine Zeile ändert, ändert sie
# dort mit; nichts hält die beiden Blöcke aneinander. Der Preis ist bewusst
# gezahlt: eine Vererbung oder eine Vorlage wäre ein neuer Mechanismus, und für
# zwei Blöcke in einer von Hand gepflegten Datei ist ein Hinweis die angemessene
# Antwort.
[[profil]]
name = "fusion-Werkbank: die Wurzel"
kennzeichen = '^\.fusion-setup$'

  [[profil.zeile]]
  beschriftung = "Projekt"
  feld = { datei = '^\.fusion-setup$', feldmuster = '"setup_pwd":"[^"]*/([^"/]+)"' }

  [[profil.zeile]]
  beschriftung = "Eingerichtet"
  feld = { datei = '^\.fusion-setup$', feldmuster = '"setup_at":"([^"]*)"' }

  [[profil.zeile]]
  beschriftung = "fusion-Fassung"
  feld = { datei = '^\.fusion-setup$', feldmuster = '"plugin_version":"([^"]*)"' }

  [[profil.zeile]]
  beschriftung = "Aktive Runde"
  feld = { datei = '^\.active-circle$', feldmuster = '^([^\n]+)' }

  [[profil.zeile]]
  beschriftung = "Sitzung"
  feld = { datei = '^orchestrator-live\.md$', feldmuster = '(?m)^## Current\n(?:[^\S\n]*\n)*[^\S\n]*([^#\n][^\n]*)' }

  [[profil.zeile]]
  beschriftung = "Runden"
  zaehlung = { ordner = "circles" }

  [[profil.zeile]]
  beschriftung = "Offene Defekte, gemeinsam"
  zaehlung = { ordner = "shared/issues", muster = '_o_.*\.md$' }

# Ein Speicher, gemeinsam oder in einer Runde.
#
# Ein Profil für die neun Speichernamen unter `shared/` und die fünf, die
# daneben in jeder Runde stehen. Vier der neun — `backlog`, `consult`,
# `investigations` und `memos` — gibt es nach den Konventionen der Werkbank
# allein unter `shared/`; sie stehen in der Aufzählung, weil das Muster für
# beide Orte dasselbe ist. Wie viele Ordner das trifft, sagt der Bestand und
# nicht diese Zeile: die Zahl wächst mit jeder Runde. Der Defektspeicher steht
# darunter als eigenes Profil, weil er nach Markern aufschlüsselt.
#
# Der Entscheidungsspeicher `decisions` steht in derselben Aufzählung und trägt
# damit dieselben zwei Zeilen wie ein Analysespeicher, obwohl seine fünf Marker
# mehr hergäben. Wer ihn nach Markern aufschlüsseln will, nimmt den Namen aus
# der Aufzählung heraus und gibt ihm ein eigenes Profil nach dem Vorbild des
# Defektspeichers darunter.
[[profil]]
name = "fusion-Werkbank: ein Speicher"
pfad = 'fusion-workbench/(shared|circles/[^/]+)/(analyses|backlog|consult|decisions|history|investigations|memos|planning|reviews)$'

  [[profil.zeile]]
  beschriftung = "Datensätze"
  zaehlung = { muster = '\.md$' }

  [[profil.zeile]]
  beschriftung = "Die jüngsten zehn"
  juengste = { muster = '\.md$', anzahl = 10 }

# Ein Defektspeicher, gemeinsam oder in einer Runde.
#
# Der Marker im Dateinamen trägt den Stand, und das Vokabular der Werkbank hat
# vier davon: `_o_` offen, `_p_` in Arbeit, `_c_` geschlossen, `_d_`
# zurückgestellt.
#
# Drei der vier bekommen eine eigene Zeile. `_p_` bekommt keine: er steht nur,
# solange gerade jemand an dem Datensatz arbeitet. Damit er trotzdem nicht
# unsichtbar bleibt, führt die erste Zeile die Gesamtzahl — die Summe der drei
# Zeilen darunter geht gegen sie auf, und jeder Marker, den keine eigene Zeile
# führt, wird als Differenz sichtbar.
[[profil]]
name = "fusion-Werkbank: ein Defektspeicher"
pfad = 'fusion-workbench/(shared|circles/[^/]+)/issues$'

  [[profil.zeile]]
  beschriftung = "Datensätze"
  zaehlung = { muster = '\.md$' }

  [[profil.zeile]]
  beschriftung = "Offen"
  zaehlung = { muster = '_o_.*\.md$' }

  [[profil.zeile]]
  beschriftung = "Geschlossen"
  zaehlung = { muster = '_c_.*\.md$' }

  [[profil.zeile]]
  beschriftung = "Zurückgestellt"
  zaehlung = { muster = '_d_.*\.md$' }

  [[profil.zeile]]
  beschriftung = "Die jüngsten zehn"
  juengste = { muster = '\.md$', anzahl = 10 }

# Das Verzeichnis aller Runden.
#
# Der Zustand einer Runde steht im DATEINAMEN ihres Circle-Datensatzes, also
# eine Ebene tiefer: `<runde>/_X_circle.md`. Deshalb tragen die sechs
# Zustandszeilen `ordner = "*"` und zählen über jede Runde hinweg. Alle sechs
# nennen denselben Ort und teilen sich damit EINEN Leselauf; die Defektzeile
# nennt `*/issues` und kostet einen zweiten. Zusammen mit der Lesung des
# Verzeichnisses selbst sind es drei, gleich wie viele Runden darin stehen.
#
# SECHS ZEILEN UND NICHT VIER: das Vokabular der Werkbank hat sechs Marker
# (`_a_` vorgesehen, `_t_` aktiv, `_c_` kohärent geschlossen, `_b_` beschränkt
# geschlossen, `_s_` überholt, `_d_` zurückgestellt), und dieses Projekt
# unterscheidet einen beschränkten von einem kohärenten Abschluss ausdrücklich.
# Die sechs sind überschneidungsfrei und vollständig; ihre Summe geht gegen die
# Zeile „Runden" auf, und ein siebter Marker würde als Differenz sichtbar. Das
# Profil einer EINZELNEN Runde weiter unten fasst dieselben sechs Marker zu vier
# Zeilen zusammen, und das ist kein Widerspruch: dort sagt genau eine Zeile „ja"
# und die Frage ist, in welchem Zustand diese eine Runde steht, hier ist die
# Frage, wie viele in jedem Zustand stehen.
[[profil]]
name = "fusion-Werkbank: alle Runden"
pfad = 'fusion-workbench/circles$'

  [[profil.zeile]]
  beschriftung = "Runden"
  zaehlung = { }

  [[profil.zeile]]
  beschriftung = "Vorgesehen"
  zaehlung = { ordner = "*", muster = '^_a_circle\.md$' }

  [[profil.zeile]]
  beschriftung = "Aktiv"
  zaehlung = { ordner = "*", muster = '^_t_circle\.md$' }

  [[profil.zeile]]
  beschriftung = "Kohärent geschlossen"
  zaehlung = { ordner = "*", muster = '^_c_circle\.md$' }

  [[profil.zeile]]
  beschriftung = "Beschränkt geschlossen"
  zaehlung = { ordner = "*", muster = '^_b_circle\.md$' }

  [[profil.zeile]]
  beschriftung = "Überholt"
  zaehlung = { ordner = "*", muster = '^_s_circle\.md$' }

  [[profil.zeile]]
  beschriftung = "Zurückgestellt"
  zaehlung = { ordner = "*", muster = '^_d_circle\.md$' }

  [[profil.zeile]]
  beschriftung = "Offene Defekte, alle Runden"
  zaehlung = { ordner = "*/issues", muster = '_o_.*\.md$' }

# Der Ablagespeicher.
#
# Erkannt über den Pfad und nicht über eine Kennzeichendatei, denn `archive/`
# trägt keine. Das Muster verlangt, dass `archive` unmittelbar hinter
# `fusion-workbench` steht, und trifft damit nicht die Speicher INNERHALB eines
# Ablagelaufs, also nichts unter `archive/<lauf>/shared/`.
#
# Ein Ablagelauf ist ein ORDNER, und `zeigt = "datum"` ist die Form von
# `juengste`, die Einträge jedes Typs sieht. Mit `zeigt = "titel"` stünde hier
# der Platzhalter, denn dieser Speicher enthält keine Dateien.
[[profil]]
name = "fusion-Werkbank: der Ablagespeicher"
pfad = 'fusion-workbench/archive$'

  [[profil.zeile]]
  beschriftung = "Läufe"
  zaehlung = { }

  [[profil.zeile]]
  beschriftung = "Zuletzt abgelegt"
  juengste = { anzahl = 1, zeigt = "datum" }

# Der gemeinsame Speicher.
#
# Er führt zehn Unterspeicher, und jeder bekommt zwei Zeilen: wie viele
# Datensätze darin stehen und wann zuletzt einer geschrieben wurde. Zwanzig
# Zeilen, aber nur ZEHN Leseläufe, denn die zwei Zeilen eines Unterspeichers
# nennen denselben Ort und teilen sich seine Lesung. Die Erkennung über `pfad`
# kostet keinen Lauf dazu. Von den zwölf erlaubten Läufen bleiben damit zwei
# übrig; wer einen elften Unterspeicher aufnimmt, rechnet nach, was er kostet.
#
# Die Datumszeilen öffnen keine Datei: `zeigt = "datum"` liest das
# Änderungsdatum aus dem Verzeichniseintrag, den der Leselauf ohnehin liefert.
# Dieser Block kostet deshalb null Dateiöffnungen.
[[profil]]
name = "fusion-Werkbank: der gemeinsame Speicher"
pfad = 'fusion-workbench/shared$'

  [[profil.zeile]]
  beschriftung = "Analysen"
  zaehlung = { ordner = "analyses", muster = '\.md$' }

  [[profil.zeile]]
  beschriftung = "Analysen, zuletzt"
  juengste = { ordner = "analyses", muster = '\.md$', anzahl = 1, zeigt = "datum" }

  [[profil.zeile]]
  beschriftung = "Ideen"
  zaehlung = { ordner = "backlog", muster = '\.md$' }

  [[profil.zeile]]
  beschriftung = "Ideen, zuletzt"
  juengste = { ordner = "backlog", muster = '\.md$', anzahl = 1, zeigt = "datum" }

  [[profil.zeile]]
  beschriftung = "Beratungen"
  zaehlung = { ordner = "consult", muster = '\.md$' }

  [[profil.zeile]]
  beschriftung = "Beratungen, zuletzt"
  juengste = { ordner = "consult", muster = '\.md$', anzahl = 1, zeigt = "datum" }

  [[profil.zeile]]
  beschriftung = "Entscheidungen"
  zaehlung = { ordner = "decisions", muster = '\.md$' }

  [[profil.zeile]]
  beschriftung = "Entscheidungen, zuletzt"
  juengste = { ordner = "decisions", muster = '\.md$', anzahl = 1, zeigt = "datum" }

  [[profil.zeile]]
  beschriftung = "Verläufe"
  zaehlung = { ordner = "history", muster = '\.md$' }

  [[profil.zeile]]
  beschriftung = "Verläufe, zuletzt"
  juengste = { ordner = "history", muster = '\.md$', anzahl = 1, zeigt = "datum" }

  [[profil.zeile]]
  beschriftung = "Untersuchungen"
  zaehlung = { ordner = "investigations", muster = '\.md$' }

  [[profil.zeile]]
  beschriftung = "Untersuchungen, zuletzt"
  juengste = { ordner = "investigations", muster = '\.md$', anzahl = 1, zeigt = "datum" }

  [[profil.zeile]]
  beschriftung = "Defekte"
  zaehlung = { ordner = "issues", muster = '\.md$' }

  [[profil.zeile]]
  beschriftung = "Defekte, zuletzt"
  juengste = { ordner = "issues", muster = '\.md$', anzahl = 1, zeigt = "datum" }

  [[profil.zeile]]
  beschriftung = "Notizen"
  zaehlung = { ordner = "memos", muster = '\.md$' }

  [[profil.zeile]]
  beschriftung = "Notizen, zuletzt"
  juengste = { ordner = "memos", muster = '\.md$', anzahl = 1, zeigt = "datum" }

  [[profil.zeile]]
  beschriftung = "Planung"
  zaehlung = { ordner = "planning", muster = '\.md$' }

  [[profil.zeile]]
  beschriftung = "Planung, zuletzt"
  juengste = { ordner = "planning", muster = '\.md$', anzahl = 1, zeigt = "datum" }

  [[profil.zeile]]
  beschriftung = "Durchsichten"
  zaehlung = { ordner = "reviews", muster = '\.md$' }

  [[profil.zeile]]
  beschriftung = "Durchsichten, zuletzt"
  juengste = { ordner = "reviews", muster = '\.md$', anzahl = 1, zeigt = "datum" }

# Eine einzelne Runde.
#
# Erkannt über den Circle-Datensatz, dessen Name den Zustandsmarker trägt. Kein
# Pfadmuster dieser Datei trifft ein Rundenverzeichnis, also kann dieses Profil
# im ersten Durchgang nicht überholt werden.
#
# Der Zustand steht als vier Zeilen und nicht als eine, weil er im DATEINAMEN
# des Datensatzes steht und in keinem Feld darin; keiner der vier Bausteine
# liefert einen Dateinamen. Die vier Zeilen decken die sechs Marker des
# Werkbankvokabulars vollständig ab: `_a_` vorgesehen, `_t_` aktiv, `_c_` und
# `_b_` geschlossen, `_s_` und `_d_` abgelegt. Genau eine der vier Zeilen sagt
# „ja", die drei übrigen sagen „nein".
[[profil]]
name = "fusion-Werkbank: eine Runde"
kennzeichen = '^_._circle\.md$'

  [[profil.zeile]]
  beschriftung = "Vorgesehen"
  vorhandensein = { muster = '^_a_circle\.md$' }

  [[profil.zeile]]
  beschriftung = "Aktiv"
  vorhandensein = { muster = '^_t_circle\.md$' }

  [[profil.zeile]]
  beschriftung = "Geschlossen"
  vorhandensein = { muster = '^_[cb]_circle\.md$' }

  [[profil.zeile]]
  beschriftung = "Abgelegt"
  vorhandensein = { muster = '^_[sd]_circle\.md$' }

  [[profil.zeile]]
  beschriftung = "Directive"
  feld = { datei = '^_._circle\.md$', feldmuster = '(?sm)^## Directive\s*\n+(.+?)\n\n' }

  [[profil.zeile]]
  beschriftung = "Spec"
  vorhandensein = { ordner = "planning", muster = '_._spec-' }

  [[profil.zeile]]
  beschriftung = "Plan"
  vorhandensein = { ordner = "planning", muster = '_._plan-' }

  [[profil.zeile]]
  beschriftung = "Entscheidungen"
  zaehlung = { ordner = "decisions", muster = '\.md$' }

  [[profil.zeile]]
  beschriftung = "Die jüngsten zehn Verläufe"
  juengste = { ordner = "history", muster = '\.md$', anzahl = 10 }

# Das Verzeichnis, das eine fusion-Werkbank enthält.
#
# Erkannt über den Eintrag `fusion-workbench` darin, also über den Namen und
# nicht über den Inhalt: welcher Ordner eine Projektwurzel ist, beantwortet der
# Nutzer damit hier, wo er es ändern kann, und nicht die Anwendung.
#
# DAS IST DIE ERKENNUNG, DIE DAS WURZELPROFIL OBEN FÜR SICH VERWIRFT, und sie
# hat ihren Preis: ein `kennzeichen` sieht allein die Namen der Einträge und
# kann nicht in den Ordner hineinsehen. Ein leeres `fusion-workbench` oder eine
# Datei dieses Namens genügt, und die Vorschau zeigt statt der Metadaten sieben
# Zeilen Platzhalter. Der Preis ist in Kauf genommen, weil die Auskunft an
# einer eingerichteten Projektwurzel ihn aufwiegt; wer ihn nicht zahlen will,
# streicht dieses Profil und sieht an der Projektwurzel die Metadaten.
#
# DIESE SIEBEN ZEILEN SIND DIE DES WURZELPROFILS GANZ OBEN, jede mit
# `fusion-workbench/` vor der Ortsangabe. Sie stehen zweimal in dieser Datei und
# können auseinanderlaufen; nichts hält sie aneinander. Wer eine ändert, ändert
# die andere mit. Der Grund steht oben beim Wurzelprofil.
[[profil]]
name = "Projektwurzel mit fusion-Werkbank"
kennzeichen = '^fusion-workbench$'

  [[profil.zeile]]
  beschriftung = "Projekt"
  feld = { ordner = "fusion-workbench", datei = '^\.fusion-setup$', feldmuster = '"setup_pwd":"[^"]*/([^"/]+)"' }

  [[profil.zeile]]
  beschriftung = "Eingerichtet"
  feld = { ordner = "fusion-workbench", datei = '^\.fusion-setup$', feldmuster = '"setup_at":"([^"]*)"' }

  [[profil.zeile]]
  beschriftung = "fusion-Fassung"
  feld = { ordner = "fusion-workbench", datei = '^\.fusion-setup$', feldmuster = '"plugin_version":"([^"]*)"' }

  [[profil.zeile]]
  beschriftung = "Aktive Runde"
  feld = { ordner = "fusion-workbench", datei = '^\.active-circle$', feldmuster = '^([^\n]+)' }

  [[profil.zeile]]
  beschriftung = "Sitzung"
  feld = { ordner = "fusion-workbench", datei = '^orchestrator-live\.md$', feldmuster = '(?m)^## Current\n(?:[^\S\n]*\n)*[^\S\n]*([^#\n][^\n]*)' }

  [[profil.zeile]]
  beschriftung = "Runden"
  zaehlung = { ordner = "fusion-workbench/circles" }

  [[profil.zeile]]
  beschriftung = "Offene Defekte, gemeinsam"
  zaehlung = { ordner = "fusion-workbench/shared/issues", muster = '_o_.*\.md$' }

# ============================================================================
# Die Profile für eine flight-Werkbank
# ============================================================================
#
# flight ist die kleinere Schwester von fusion: dieselbe Art von Datensätzen,
# aber ohne Runden und ohne Zustandsmarker im Dateinamen. Die Speicher liegen
# flach an der Wurzel der Werkbank, und ein Datensatz heißt schlicht
# `260528-14-40-route-option-a.md`. Jede Zeile, die bei fusion nach Markern
# aufschlüsselt, hat hier also keinen Gegenstand, und deshalb stehen unten vier
# Profile und nicht acht: der Defektspeicher mit seiner Aufschlüsselung nach
# Markern und die zwei Rundenprofile haben hier nichts zu zeigen, und die
# Aufgabe des gemeinsamen Speichers fällt dem Wurzelprofil zu, weil eine
# flight-Werkbank kein `shared/` hat und ihre Speicher flach führt.
#
# `.flight-setup` trägt dieselben Felder wie `.fusion-setup` UND DAZU
# `setup_pwd`, das fusion nicht mehr schreibt. Alle drei Muster greifen
# deshalb, aber nicht mit derselben Ausbeute: zwei liefern an beiden Dateien
# einen Wert, das dritte allein an `.flight-setup`. Die Zeile „Projekt" steht
# hier also mit einem Wert da und an einer fusion-Werkbank leer; der Absatz
# beim fusion-Wurzelprofil oben schreibt es aus.

# Die Wurzel einer flight-Werkbank.
#
# Erkannt über `.flight-setup`, aus demselben Grund, aus dem das fusion-Profil
# über `.fusion-setup` erkennt: ein Pfadmuster auf den Namen träfe auch einen
# leeren Ordner.
#
# Vier Speicher, und jeder bekommt ZWEI Zeilen: wie viele Datensätze darin
# stehen und wann zuletzt einer geschrieben wurde. Das ist der Zuschnitt des
# Profils „fusion-Werkbank: der gemeinsame Speicher" oben, auf eine
# flight-Werkbank angewandt — dort liegen die Speicher unter `shared/` und
# tragen ein eigenes Profil, hier liegen sie flach an der Wurzel und werden von
# diesem mitgeführt. `stilwerk` bekommt keine Zeile: es trägt die Stilprofile,
# mit denen flight schreibt, und keine Datensätze über die Reise.
#
# Der Ablagespeicher führt seine Läufe als ORDNER, und seine zwei Zeilen tragen
# deshalb kein `muster`; `zeigt = "datum"` ist dort nicht eine Wahl unter
# zweien, denn `zeigt = "titel"` öffnete Dateien und sähe in diesem Speicher
# keinen einzigen Eintrag. Das eigene Profil „flight-Werkbank: der
# Ablagespeicher" unten schreibt denselben Baustein aus.
#
# ELF ZEILEN, FÜNF LESELÄUFE, DREI ÖFFNUNGEN. Die drei Feldzeilen nennen den
# erkannten Ordner selbst und teilen sich dessen Lesung mit der Erkennung über
# `.flight-setup`; dazu kommt je ein Lauf für `decisions`, `history`, `memos`
# und `archive`, und die zwei Zeilen eines Speichers nennen denselben Ort und
# teilen sich seine Lesung. Von den zwölf erlaubten Läufen bleiben sieben
# übrig. Die drei Öffnungen gehen allein auf die Feldzeilen: `zeigt = "datum"`
# liest das Änderungsdatum aus dem Verzeichniseintrag, den der Leselauf ohnehin
# liefert, und öffnet nichts.
#
# DIESE ELF ZEILEN STEHEN EIN ZWEITES MAL IN DIESER DATEI, nämlich im Profil
# „Projektwurzel mit flight-Werkbank" ganz unten, dort jede mit
# `flight-workbench/` vor der Ortsangabe. Wer hier eine Zeile ändert, ändert sie
# dort mit; nichts hält die beiden Blöcke aneinander. Der Preis ist bewusst
# gezahlt, aus dem Grund, den das fusion-Wurzelprofil oben ausschreibt: eine
# Vererbung oder eine Vorlage wäre ein neuer Mechanismus, und für zwei Blöcke in
# einer von Hand gepflegten Datei ist ein Hinweis die angemessene Antwort.
[[profil]]
name = "flight-Werkbank: die Wurzel"
kennzeichen = '^\.flight-setup$'

  [[profil.zeile]]
  beschriftung = "Projekt"
  feld = { datei = '^\.flight-setup$', feldmuster = '"setup_pwd":"[^"]*/([^"/]+)"' }

  [[profil.zeile]]
  beschriftung = "Eingerichtet"
  feld = { datei = '^\.flight-setup$', feldmuster = '"setup_at":"([^"]*)"' }

  [[profil.zeile]]
  beschriftung = "flight-Fassung"
  feld = { datei = '^\.flight-setup$', feldmuster = '"plugin_version":"([^"]*)"' }

  [[profil.zeile]]
  beschriftung = "Entscheidungen"
  zaehlung = { ordner = "decisions", muster = '\.md$' }

  [[profil.zeile]]
  beschriftung = "Entscheidungen, zuletzt"
  juengste = { ordner = "decisions", muster = '\.md$', anzahl = 1, zeigt = "datum" }

  [[profil.zeile]]
  beschriftung = "Verläufe"
  zaehlung = { ordner = "history", muster = '\.md$' }

  [[profil.zeile]]
  beschriftung = "Verläufe, zuletzt"
  juengste = { ordner = "history", muster = '\.md$', anzahl = 1, zeigt = "datum" }

  [[profil.zeile]]
  beschriftung = "Notizen"
  zaehlung = { ordner = "memos", muster = '\.md$' }

  [[profil.zeile]]
  beschriftung = "Notizen, zuletzt"
  juengste = { ordner = "memos", muster = '\.md$', anzahl = 1, zeigt = "datum" }

  [[profil.zeile]]
  beschriftung = "Ablagen"
  zaehlung = { ordner = "archive" }

  [[profil.zeile]]
  beschriftung = "Ablagen, zuletzt"
  juengste = { ordner = "archive", anzahl = 1, zeigt = "datum" }

# Ein Speicher einer flight-Werkbank.
#
# Drei Namen und nicht vier: `archive` steht darunter als eigenes Profil, weil
# es Läufe als Ordner führt und keine Datensätze als Dateien. Das ist die eine
# Ausnahme, die dieser Zuschnitt braucht — die zweite Ausnahme des
# fusion-Vorbilds, der Defektspeicher mit seiner Aufschlüsselung nach Markern,
# hat hier keinen Gegenstand.
[[profil]]
name = "flight-Werkbank: ein Speicher"
pfad = 'flight-workbench/(decisions|history|memos)$'

  [[profil.zeile]]
  beschriftung = "Datensätze"
  zaehlung = { muster = '\.md$' }

  [[profil.zeile]]
  beschriftung = "Die jüngsten zehn"
  juengste = { muster = '\.md$', anzahl = 10 }

# Der Ablagespeicher einer flight-Werkbank.
[[profil]]
name = "flight-Werkbank: der Ablagespeicher"
pfad = 'flight-workbench/archive$'

  [[profil.zeile]]
  beschriftung = "Läufe"
  zaehlung = { }

  [[profil.zeile]]
  beschriftung = "Zuletzt abgelegt"
  juengste = { anzahl = 1, zeigt = "datum" }

# Das Verzeichnis, das eine flight-Werkbank enthält.
#
# DIESE ELF ZEILEN SIND DIE DES WURZELPROFILS DARÜBER, jede mit
# `flight-workbench/` vor der Ortsangabe. Sie stehen zweimal in dieser Datei und
# können auseinanderlaufen; nichts hält sie aneinander. Wer eine ändert, ändert
# die andere mit. Der Grund steht oben beim Wurzelprofil.
#
# ELF ZEILEN, SECHS LESELÄUFE, DREI ÖFFNUNGEN. Ein Lauf mehr als beim
# Wurzelprofil, und der Halbsatz „plus einen Lauf für die Erkennung" oben ist
# der Grund: hier trägt JEDE Zeile eine Ortsangabe, keine nennt den erkannten
# Ordner selbst, also liest den allein die Erkennung über
# `kennzeichen = '^flight-workbench$'`. Fünf genannte Orte plus dieser eine Lauf
# sind sechs, und von den zwölf erlaubten bleiben sechs übrig. Die drei
# Öffnungen sind dieselben drei Feldzeilen wie oben.
#
# Erkannt wird auch hier am Namen, und der Preis ist derselbe wie beim
# fusion-Projektwurzelprofil oben: ein leeres `flight-workbench` liefert
# elf Zeilen Platzhalter statt der Metadaten.
#
# Enthält ein Verzeichnis BEIDE Werkbänke, gewinnt das fusion-Profil, weil es
# in dieser Datei weiter oben steht. Wer es andersherum will, verschiebt die
# Blöcke.
[[profil]]
name = "Projektwurzel mit flight-Werkbank"
kennzeichen = '^flight-workbench$'

  [[profil.zeile]]
  beschriftung = "Projekt"
  feld = { ordner = "flight-workbench", datei = '^\.flight-setup$', feldmuster = '"setup_pwd":"[^"]*/([^"/]+)"' }

  [[profil.zeile]]
  beschriftung = "Eingerichtet"
  feld = { ordner = "flight-workbench", datei = '^\.flight-setup$', feldmuster = '"setup_at":"([^"]*)"' }

  [[profil.zeile]]
  beschriftung = "flight-Fassung"
  feld = { ordner = "flight-workbench", datei = '^\.flight-setup$', feldmuster = '"plugin_version":"([^"]*)"' }

  [[profil.zeile]]
  beschriftung = "Entscheidungen"
  zaehlung = { ordner = "flight-workbench/decisions", muster = '\.md$' }

  [[profil.zeile]]
  beschriftung = "Entscheidungen, zuletzt"
  juengste = { ordner = "flight-workbench/decisions", muster = '\.md$', anzahl = 1, zeigt = "datum" }

  [[profil.zeile]]
  beschriftung = "Verläufe"
  zaehlung = { ordner = "flight-workbench/history", muster = '\.md$' }

  [[profil.zeile]]
  beschriftung = "Verläufe, zuletzt"
  juengste = { ordner = "flight-workbench/history", muster = '\.md$', anzahl = 1, zeigt = "datum" }

  [[profil.zeile]]
  beschriftung = "Notizen"
  zaehlung = { ordner = "flight-workbench/memos", muster = '\.md$' }

  [[profil.zeile]]
  beschriftung = "Notizen, zuletzt"
  juengste = { ordner = "flight-workbench/memos", muster = '\.md$', anzahl = 1, zeigt = "datum" }

  [[profil.zeile]]
  beschriftung = "Ablagen"
  zaehlung = { ordner = "flight-workbench/archive" }

  [[profil.zeile]]
  beschriftung = "Ablagen, zuletzt"
  juengste = { ordner = "flight-workbench/archive", anzahl = 1, zeigt = "datum" }
