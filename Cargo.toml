[workspace]
resolver = "3"
members = [
    "crates/krk-core",
    "crates/krk-ui",
    "crates/krk-bench",
    "xtask",
]

# Gemeinsame Paketangaben. Jedes Mitglied erbt sie ueber `field.workspace = true`,
# damit Version und Edition an einer Stelle stehen.
[workspace.package]
version = "1.2.2"
edition = "2024"
rust-version = "1.97.1"
publish = false

# Gemeinsame Abhaengigkeiten. Die Versionsangabe steht hier, das Mitglied nennt
# nur noch `workspace = true`.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
toml = "1"
# Die sprachsensitive Kollation der Namenssortierung (C1), Antwort auf
# `decisions/260802-1810_*_sortierung-ohne-sprachsensitive-kollation.md`.
# Rusts Standardbibliothek bringt keine Kollation mit; ohne sie sortiert
# `Aepfel` hinter `Zebra`, weil `Ae` in der Unicode-Tabelle nach `Z` steht.
#
# Ausschlaggebend fuer diese Kiste und gegen die beiden Alternativen ist
# `Collator::write_sort_key_to`: sie liefert den Vergleich als **Bytefolge**
# und haelt damit den Zuschnitt, den `verzeichnis::eintrag` seit Schritt 2
# traegt — der Schluessel entsteht einmal beim Lesen, das Sortieren vergleicht
# nur noch Bytes. Beide Alternativen koennen das nicht:
#
# - `objc2-foundation` mit `localizedStandardCompare:` waere der Weg, den die
#   Technologiewahl nahelegt, hat aber keine Schluesselbildung. Er kennt nur
#   den paarweisen Vergleich und verlangt damit je Sortierschritt einen
#   Fremdaufruf: bei 100.000 Eintraegen rund 1,7 Millionen statt 100.000
#   Schluesseln. Dazu haette er `krk-core` an Foundation gebunden, und der
#   Kern ist die Schicht ohne Fensterwerkzeug (`lib.rs`).
# - `feruca` setzt denselben Algorithmus in reinem Rust um, haelt sein Modul
#   `sort_key` aber privat und bietet nach aussen allein `Collator::collate`,
#   also wieder nur den paarweisen Vergleich.
#
# `default-features` bleibt an: das Merkmal `compiled_data` backt die
# CLDR-Tabellen in das Programm und ist der Grund, aus dem zur Laufzeit keine
# Datei gesucht und kein Fehler behandelt werden muss.
icu_collator = "2.2"
# Der Mustervergleich der Leseprofile (C2 und C3 der Runde 16). Welche Kiste
# ihn traegt, entscheidet nicht der Spec, sondern der Plan:
# `circles/260823-2208-vorschau-zeigt-profil-zusammenfassung-statt-metadaten/planning/260824-0640_*_plan-vorschau-zeigt-profil-zusammenfassung-statt-metadaten.md`,
# Abschnitt `### Die Kiste und der Grund`.
#
# **C2.8 verlangt eine Laufzeitzusage, die vom Muster unabhaengig ist:** ein
# Ausdruck, den der Nutzer in seine `readers.toml` schreibt, darf die Vorschau
# nicht anhalten koennen. Aus dem Text eines Ausdrucks allein ist das nicht
# entscheidbar, denn welche Muster eine rueckverfolgende Auswertung exponentiell
# laufen lassen, steht nicht im Muster; C2.8 fuehrt mit `(a+)+$` das
# Standardbeispiel dafuer an. `regex` wertet ueber endliche Automaten aus und
# laeuft damit linear in der Laenge der Eingabe, gleich welches Muster dasteht.
# Die Zusage ist so eine Eigenschaft der Auswertungsmaschine und keine
# Vorhersage ueber ein Muster.
#
# **`fancy-regex` steht ueber `syntect` schon im Baum und scheidet trotzdem
# aus.** Es wertet rueckverfolgend aus und kappt seine Arbeit ueber eine
# Schrittgrenze: `backtrack_limit`, in der Vorgabe 1.000.000 Schritte, gemessen
# an Fassung 0.16.2. Ist sie erreicht, liefert der Aufruf
# `BacktrackLimitExceeded` statt einer Antwort. Eine Schrittgrenze naehert die
# Frage "laeuft dieses Muster in vertretbarer Zeit" an, statt sie zu
# beantworten, und C2.8 verlangt die Antwort. Dazu ist `fancy-regex` heute
# Abhaengigkeit von `krk-ui` und nicht von `krk-core`; eine unmittelbare Nennung
# mit Begruendung an dieser Stelle kostete es in jedem Fall.
#
# Keine bestehende Abhaengigkeit leistet einen Mustervergleich: `icu_collator`
# sortiert, `toml` zerlegt, `pulldown-cmark` rendert Markdown, `syntect` faerbt
# ein, `signal-hook` faengt Signale, die `objc2`-Kisten reichen AppKit durch.
#
# **Was mitkommt, gezaehlt und nicht geschaetzt.** Am 260824 auf diesem Geraet
# erhoben, mit `cargo tree -p krk-core -e normal` und dem Vergleich von
# `Cargo.lock` vor und nach der Aufnahme:
#
# - **Ein einziges neues Paket**, `regex` 1.13.1: `Cargo.lock` waechst von 97
#   auf 98 Eintraege. Die vier Kisten, auf denen `regex` aufsetzt, standen
#   bereits in genau diesen Fassungen im Baum, saemtlich ueber `fancy-regex`:
#   `regex-automata` 0.4.18, `regex-syntax` 0.8.11, `aho-corasick` 1.1.5 und
#   `memchr` 2.8.3. Die Begruendung zu `syntect` weiter unten zaehlt dieselben
#   vier namentlich auf.
# - **Das eine neue Paket kommt auf dem Bauziel an.** Es haengt an keinem
#   Zielvorbehalt und steht unmittelbar unter `krk-core` im Baum. Von den vier
#   schon vorhandenen Kisten kommt keine neu hinzu; der Zuwachs bleibt damit
#   eins von eins.
# - **Weder `cc` noch ein `-sys`-Paket kommt hinzu.** `cargo tree --workspace
#   -e normal,build` findet im ganzen Baum weder `cc` noch `onig` noch einen
#   Namen auf `-sys`. `windows-sys` steht wie zuvor allein in `Cargo.lock`,
#   haengt am Windows-Ziel und wird auf macOS nie uebersetzt. Die Zusage aus
#   der Technologiewahl haelt: die Bauvoraussetzungen aendern sich nicht.
#
# Die Vorgabemerkmale bleiben an, anders als bei den meisten Eintraegen dieser
# Datei, und beide tragenden sind hier noetig. `unicode` laesst `.`, `\w` und
# die Schreibungsfaltung ueber die ganze Zeichenmenge greifen statt nur ueber
# ASCII; die Muster laufen ueber Dateinamen und Dateiinhalte dieser Werkbank,
# und die tragen Umlaute. `perf` schaltet allein Beschleuniger in
# `regex-automata` ein, und keiner davon nimmt die Zusage oben zurueck: der
# Zweig hinter `perf-backtrack` laeuft nur dort, wo die Suche nachweislich
# beschraenkt ist, und merkt besuchte Zustaende vor, statt sie erneut zu
# betreten.
#
# Die Mindestfassung passt: `rust-version = "1.65"`, das Projekt faehrt 1.97.1.
regex = "1"
# Das Archivformat fuer das Packen und Entpacken (Zip und Unzip im
# Kontextmenue, Runde 17). Warum diese Kiste und nicht ein Systemwerkzeug, steht
# ausgeschrieben im Plan:
# `circles/260825-0711-kontextmenue-traegt-zip-unzip-finder/planning/260825-0727_*_plan-kontextmenue-traegt-zip-unzip-finder.md`,
# Abschnitt `### Die Kiste und der Grund`. Drei Wege standen zur Wahl.
#
# **Ein Unterprozess auf `ditto(1)` oder `zip(1)` scheidet aus.** Er meldet
# keinen Fortschritt je Eintrag, sein Abbruch waere ein Signal an einen fremden
# Prozess statt ein `AtomicBool` zwischen zwei Eintraegen, und seinen Fehler
# schreibt er auf die Standardfehlerausgabe, die C1 der Runde 1 als Kanal an den
# Nutzer ausschliesst. Er waere zudem der erste Unterprozess dieses Vorhabens,
# mit den Fragen, wer ihn abholt und was der Hauptfaden solange tut;
# `appkit/terminal.rs` fuehrt genau diese drei Gruende schon einmal auf und hat
# sich deshalb gegen `open -a` entschieden.
#
# **Ein eigener Zip-Schreiber in `krk-core` scheidet ebenfalls aus.** Ohne
# Kompression waere er machbar und lieferte Archive, die kein Nutzer erwartet;
# mit Kompression brauchte er eine Deflate-Umsetzung, und die steht mit `flate2`
# bereits im Baum, aber nicht als Archivformat.
#
# Keine bestehende Abhaengigkeit leistet das Archivformat: `icu_collator`
# sortiert, `regex` vergleicht Muster, `toml` zerlegt, `pulldown-cmark` rendert
# Markdown, `syntect` faerbt ein, `signal-hook` faengt Signale, die
# `objc2`-Kisten reichen AppKit durch. `flate2` kommt am naechsten und kennt
# doch nur den Datenstrom, nicht den Behaelter, der ihn je Eintrag mit Namen,
# Rechten und Pruefsumme umgibt.
#
# **Was `zip` mitbringt, ist gezaehlt und nicht geschaetzt.** Am 260825 auf
# diesem Geraet erhoben, mit `cargo add` in einem Wegwerf-Workspace,
# `cargo tree -e normal,build` und dem Vergleich der beiden `Cargo.lock`:
#
# - **Zwei neue Pakete**, `zip 8.6.0` und `typed-path 0.12.3`. Alles Uebrige,
#   worauf `zip` aufsetzt, steht bereits in KRKs `Cargo.lock`, und zwar in
#   denselben Fassungen: `flate2 1.1.9`, `miniz_oxide 0.8.9`, `adler2 2.0.1`,
#   `simd-adler32 0.3.10`, `cfg-if 1.0.4`, `memchr 2.8.3`, `indexmap 2.14.0`,
#   `hashbrown 0.17.1` und `equivalent 1.0.2`. Sie kommen ueber `syntect` und
#   `toml` schon herein. Die Erhebung im Wegwerf-Workspace sah `crc32fast` von
#   1.5.0 auf 1.5.1 steigen, also eine Fehlerbehebungsstufe; **in KRKs Baum
#   steigt es nicht**, weil die vorhandene `Cargo.lock` 1.5.0 haelt und `zip`
#   sich damit begnuegt (`cargo tree --workspace -e normal,build -i crc32fast`,
#   am 260825 nachgesehen). Der Zuwachs bleibt damit zwei von zwei.
# - **Weder `cc` noch ein `-sys`-Paket kommt hinzu.** `cargo tree -e
#   normal,build` ueber den Pruef-Workspace findet keinen solchen Namen. Die
#   Zusage aus der Technologiewahl haelt: die Bauvoraussetzungen aendern sich
#   nicht.
# - **Die Merkmalswahl ist die Bedingung der Einbindung und keine
#   Sparsamkeit.** Der Vorgabesatz von `zip` zieht `bzip2`, `zstd` und `lzma`
#   herein, und die beiden ersten bringen C-Code mit. `default-features = false`
#   mit dem einen Merkmal `deflate-flate2` laesst genau das Deflate-Verfahren
#   uebrig, das jedes Zip-Werkzeug liest.
# - **`flate2` muss unmittelbar danebenstehen, und das ist gemessen.** `zip`
#   schaltet `flate2` **ohne** dessen Vorgabemerkmale ein; allein damit
#   uebersetzt `flate2` nicht und meldet "No compression backend selected". Ein
#   Eintrag `flate2` mit seinen Vorgabemerkmalen in derselben Kiste stellt das
#   reine Rust-Verfahren `miniz_oxide` ein, das ohnehin schon im Baum steht. Wer
#   sich auf die Merkmalsvereinigung ueber den Workspace verliesse, bekaeme
#   einen Baum, in dem `cargo build --workspace` gruen ist und
#   `cargo test -p krk-core` rot.
# - **Die Mindestfassung passt.** `zip` verlangt Rust 1.88, `typed-path` 1.65;
#   das Projekt faehrt 1.97.1.
# - **Die Geschwindigkeit ist auf diesem Geraet gemessen und nicht auf dem
#   Referenzgeraet.** Acht Megabyte kaum verdichtbarer Zufallsdaten kosten im
#   Profil `release` 212 ms, also rund 38 MB/s; acht Megabyte gut verdichtbarer
#   Daten kosten 15 ms. `speculation:` Ob das Referenzgeraet von 2018 dieselbe
#   Groessenordnung haelt, ist ungemessen. Keine der zehn Zeitzusagen aus C8
#   spricht ueber das Packen, also haengt an der Zahl keine Zusage; sie steht
#   hier, damit die spaetere Messrunde einen Ausgangswert hat.
# - **`unreserved` ist das zweite Merkmal, und es schaltet keine Abhaengigkeit
#   ein.** Es steht in `zip`s `Cargo.toml` als `unreserved = []` da und hebt
#   allein eine Pruefung auf: ohne es weist `ExtendedFileOptions::add_extra_data`
#   jede Feldkennung ab, die in `EXTRA_FIELD_MAPPING` steht und die Kiste selbst
#   nicht zerlegt. Genau eine solche Kennung braucht KRK, naemlich `0x5855`
#   (Info-ZIP Unix, alte Form). `Cargo.lock` waechst dadurch um keinen Eintrag,
#   und C-Code kommt keiner herein.
# - **Warum es zwei Zeitfelder sein muessen und nicht eines, ist gemessen und
#   nicht angenommen.** Am 260825 an fuenf von Hand gebauten Archiven ueber
#   dieselben zwei Zeitpunkte, einen aus der Sommerzeit (4. Juli 2026 14:30:45)
#   und einen aus der Winterzeit (15. Januar 2026 10:30:45), jedes mit
#   `/usr/bin/unzip` und mit `/usr/bin/ditto -x -k` ausgepackt:
#
#   | Archiv traegt | `unzip` liefert | `ditto` liefert |
#   |---|---|---|
#   | nur das MS-DOS-Feld | :44 (Zweisekundenraster) | :44, im Winter eine Stunde daneben |
#   | dazu `0x5455` | :45, beide richtig | :44, im Winter eine Stunde daneben |
#   | dazu `0x5455` und `0x5855` | :45, beide richtig | :45, beide richtig |
#
#   `ditto(1)` uebergeht `0x5455` also nachweislich und liest `0x5855`; die
#   Stunde Abweichung ist die Sommerzeitfalle, denn es rechnet die MS-DOS-Zeit
#   mit dem heute geltenden Versatz um statt mit dem am Dateidatum geltenden.
#   `unzip` seinerseits liest `0x5455`. Ein Feld allein laesst deshalb immer
#   eines der zwei Werkzeuge daneben liegen. Geschrieben wird `0x5855` in seiner
#   kurzen Form aus Zugriffs- und Aenderungszeit, ohne Benutzer- und
#   Gruppenkennung: mit ihnen setzt `ditto` beim Auspacken auch die Gruppe um,
#   und dieses Vorhaben packt Zeitstempel und keine Eigentumsverhaeltnisse.
zip = { version = "8.6", default-features = false, features = [
    "deflate-flate2",
    "unreserved",
] }
# Das Deflate-Verfahren, das `zip` selbst abschaltet. **Dieser Eintrag ist nicht
# ueberfluessig**, auch wenn kein Modul den Namen `flate2` nennt: die
# Begruendung zu `zip` darueber misst es im vierten Aufzaehlungspunkt. `zip`
# schaltet `flate2` ohne dessen Vorgabemerkmale ein und stellt damit gar kein
# Verfahren ein; erst der zweite Nenner mit Vorgabemerkmalen stellt
# `miniz_oxide` ein, das reine Rust-Verfahren, das ueber `syntect` ohnehin schon
# im Baum steht. Eine Bibliothek in C kommt darueber nicht herein. Wer die Zeile
# beim Aufraeumen als scheinbar unbenutzt streicht, macht `cargo test -p
# krk-core` rot.
flate2 = "1"
# Signalbehandlung, nur fuer die Messstrecke. `std` kennt keine Signale, und die
# einzige Zusage, die daran haengt, ist die Sitzungssicherung aus
# `krk-bench/src/messen.rs`: sie muss den vorigen Stand auch dann zurueckspielen,
# wenn ein Gesamtlauf mit Strg+C abgebrochen wird. `signal-hook` nimmt den
# Signalgriff entgegen und meldet ihn ueber ein Selbstrohr an einen gewoehnlichen
# Faden weiter; das Zurueckspielen laeuft damit ausserhalb des Signalkontextes und
# darf Dateien schreiben und melden. Zwei Wirkungen, die hier zaehlen: `krk-bench`
# behaelt `#![deny(unsafe_code)]`, und die Kiste bringt nichts mit ausser
# `signal-hook-registry` und `libc`, das ueber `objc2` ohnehin schon im Baum steht.
# `default-features = false` laesst den `channel`-Teil weg, den kein Modul nennt.
signal-hook = { version = "0.4", default-features = false, features = ["iterator"] }
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
# Core Foundation, aber nur die beiden Stuecke, die die FSEvents-Bindung aus
# Schritt 14 braucht: `CFArray` fuer die Liste der beobachteten Ordner und
# `CFString` fuer den einzelnen Pfad. Die Vorgabemerkmale zoegen ein halbes
# Hundert weiterer Typen mit herein, von denen KRK keinen nennt; deshalb
# `default-features = false`.
#
# `CFRunLoop` stand hier bis zum 260806 als drittes Merkmal, fuer die
# Laufschleife, in die der Strom gehaengt wurde. Seit dem Wechsel auf
# `FSEventStreamSetDispatchQueue` nennt kein Modul mehr einen seiner Typen
# (`issues/260805-0905_*_das-merkmal-cfrunloop-in-cargo-toml-hat-keinen-nutzer-mehr.md`).
# An der Uebersetzung aendert der Wegfall nichts: `objc2-foundation` schaltet
# dasselbe Merkmal ohnehin ein, wie `cargo tree -e features` zeigt. Die Zeile
# faellt weg, weil sie eine Verwendung behauptete, die es nicht mehr gibt.
objc2-core-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "CFArray",
    "CFString",
] }
# Core Animation, aber nur das eine Stueck davon. `CADisplayLink` ist die
# Bildgrenze, an der die Fruehmessung aus Schritt 8 ihre Spannen beendet;
# `NSView.displayLinkWithTarget:selector:` liefert ihn und liegt hinter dem
# Merkmal `objc2-quartz-core` von `objc2-app-kit`. Die Vorgabemerkmale dieser
# Kiste zoegen Metal, Core Video und ein Dutzend Ebenenklassen mit herein, von
# denen KRK nichts braucht; deshalb `default-features = false`.
objc2-quartz-core = { version = "0.3", default-features = false, features = [
    "std",
    "CADisplayLink",
] }
# PDFKit, die PDF-Bibliothek des Systems, fuer den Betrachter der Vorschau
# (Runde 20). Welche Klasse und welche Kiste, entscheidet der Plan:
# `circles/260827-2028-vorschau-rendert-pdf-als-betrachter/planning/260828-0712_*_plan-vorschau-rendert-pdf-als-betrachter.md`,
# `## Die zehn Entscheidungen`, Nr. 1 und 2. `appkit/betrachter.rs` schreibt
# den Typnamen `PDFView`.
#
# Der Rahmen steht auf jedem macOS 15 und wird wie AppKit und QuartzCore beim
# Programmstart abgebildet; ein Laden beim ersten PDF hiesse `dlopen` von Hand.
# Die Alternative ohne Kiste, `class!("PDFView")` mit `msg_send!` und einem
# `#[link]`-Block wie fuer CoreServices in `appkit/fsevents.rs`, kostete jede
# Typangabe an jedem Aufruf und machte aus den gebundenen Methoden
# handgeschriebene Selektoren mit selbst behaupteten Signaturen.
#
# Die Kiste ist derselben Bauart wie `objc2-app-kit`: erzeugte Bindungen,
# kein `build.rs`, kein C. Die Zusage aus dem Spec (Constraint 4) haelt damit;
# `Cargo.lock` fuehrt nach der Aufnahme weiterhin kein `cc` und ausser
# `windows-sys` kein `-sys`-Paket.
#
# `default-features = false`, weil der Vorgabesatz alle Anmerkungs-, Formular-
# und Miniaturenklassen von PDFKit einschaltet, von denen KRK keine nennt.
# Genannt werden allein die vier Klassen, die der Betrachter anspricht.
# `objc2-core-foundation` ist noetig, weil `scaleFactor`, `minScaleFactor` und
# `maxScaleFactor` einen `CGFloat` tragen und die Kiste diese Methoden hinter
# dem Merkmal verbirgt; `krk-ui` fuehrt die Kiste ohnehin.
# `objc2-core-graphics` bleibt aus: es wird keine Seite selbst gezeichnet.
objc2-pdf-kit = { version = "0.3", default-features = false, features = [
    "std",
    "objc2-app-kit",
    "objc2-core-foundation",
    "PDFView",
    "PDFDocument",
    "PDFPage",
    "PDFSelection",
] }
# Objective-C-Bloecke. `NSEvent.addLocalMonitorForEventsMatchingMask:handler:`
# nimmt seinen Rueckruf als Block entgegen; ohne diese Kiste laesst sich keiner
# bauen. `objc2-app-kit` fuehrt sie ohnehin schon als Vorbedingung, hier steht
# sie als unmittelbare Abhaengigkeit von `krk-ui`.
block2 = "0.6"
# Grand Central Dispatch, aber nur die Hauptschlange. Sie traegt den Weckruf
# des Vermittlerfadens aus Schritt 16: `dispatch_async` auf die Hauptschlange
# ist der vom System vorgesehene Weg, von einem Arbeitsfaden aus etwas auf dem
# Hauptfaden ausfuehren zu lassen.
dispatch2 = { version = "0.3", default-features = false, features = ["std", "objc2"] }
# Die Syntaxhervorhebung der Formatansicht (C3), Antwort auf
# `circles/260807-2116-eingebauter-editor-mit-textmarken/decisions/260807-2147_*_fuer-welche-sprachen-hebt-die-formatansicht-syntax-hervor.md`.
# Der Nutzer hat am 260808-0017 eine fertige Kiste gewaehlt und nicht von Hand
# geschriebene Sprachregeln; `syntect` erkennt die Sprache und faerbt ihre
# Wortarten ein, auf den Sprachdefinitionen von Sublime Text.
#
# Keine der bestehenden Abhaengigkeiten leistet das, und zwar aus einem Grund,
# der kurz ist: keine von ihnen kennt eine Programmiersprache. `icu_collator`
# sortiert, `signal-hook` faengt Signale, die `objc2`-Kisten reichen AppKit
# durch. `objc2-foundation` kommt am naechsten, weil `NSAttributedString` einen
# Markdown-Aufbau mitbringt, aber der endet bei Markdown und sagt zu Rust, TOML
# oder Shell nichts; C3 nennt alle vier.
#
# `default-features = false` ist hier keine Sparsamkeit, sondern die Bedingung
# der Einbindung. Der Vorgabesatz `default-onig` zieht Oniguruma herein, eine
# Bibliothek in C, und haette damit die Bauvoraussetzungen des Projekts
# geaendert. `regex-fancy` tauscht sie gegen `fancy-regex` in reinem Rust; der
# Bauzusammenhang steht in `syntect`s eigener `Cargo.toml`. Abgeschaltet bleiben
# `html`, `plist-load`, `yaml-load` und `metadata`, weil KRK die Einfaerbung
# selbst in Textmerkmale umsetzt, keine HTML-Ausgabe braucht und zur Laufzeit
# keine fremde Datei laedt.
#
# `dump-create` stand im Plan zu S32 ebenfalls unter den abgeschalteten. Das
# geht nicht: `parsing = [regex-syntax, fnv, dump-create, dump-load]` zieht es
# mit, gemessen an `syntect` 5.3.0. Der Satz im Plan ist damit ueberholt.
#
# **Was mitkommt, gezaehlt und nicht geschaetzt.** Beide Kisten zusammen ziehen
# **21 weitere Pakete** in den Baum: `Cargo.lock` waechst von 72 auf 95
# Eintraege, zwei davon sind die Kisten selbst (gezaehlt zwischen `4e86c02` und
# dem Stand nach S32). Namentlich `adler2`, `aho-corasick`, `bincode`,
# `bit-set`, `bit-vec`, `cfg-if`, `crc32fast`, `fancy-regex`, `flate2`, `fnv`,
# `memchr`, `miniz_oxide`, `once_cell`, `regex-automata`, `regex-syntax`,
# `same-file`, `simd-adler32`, `thiserror`, `thiserror-impl`, `walkdir` und
# `winapi-util`. Das ist der groesste Zuwachs am Abhaengigkeitsbaum, den dieses
# Projekt bisher aufgenommen hat; die Angabe steht hier, weil der Eintrag zu
# `signal-hook` oben dieselbe Frage als tragend behandelt. Drei Aussagen dazu
# sind gemessen:
#
# - **Auf dem Bauziel dieses Projekts kommen 20 davon an.** `winapi-util` haengt
#   ueber `same-file` und `walkdir` allein am Windows-Ziel und wird auf macOS nie
#   uebersetzt; `cargo tree --workspace -e normal` zaehlt es deshalb nicht mit.
#   Es steht nur in `Cargo.lock`. Die beiden `windows-*`-Eintraege daneben, an
#   denen es haengt, sind nicht neu: sie standen schon vor diesen Kisten da.
# - **`walkdir`, `same-file` und `winapi-util` lassen sich nicht abwaehlen.**
#   `walkdir` steht in `syntect`s eigener `Cargo.toml` (Fassung 5.3.0) als
#   gewoehnliche Abhaengigkeit ohne `optional`, haengt also an keinem
#   eingeschalteten Merkmal, und `same-file` samt `winapi-util` haengt an ihm.
#   An dieser Stelle kuerzt keine Merkmalswahl den Baum, und der naechste Leser
#   braucht es nicht neu zu messen.
# - **Keines der 21 ist ein `-sys`-Paket, und keines bringt `cc` als
#   Bauabhaengigkeit mit.** `cargo tree --workspace -e normal,build` findet im
#   ganzen Baum weder `cc` noch `onig` noch einen Namen auf `-sys`. Damit haelt
#   die Zusage aus der Technologiewahl: die Bauvoraussetzungen des Projekts
#   aendern sich durch diese beiden Kisten nicht.
#
# `default-syntaxes` bleibt an, obwohl `two-face` unten einen Obermengensatz
# mitbringt und die Anwendung den Vorgabesatz nie laedt. Gemessen kostet das
# 1.360 Byte am Programm, weil der ungenutzte Abzug wegoptimiert wird. Dafuer
# kann `crates/krk-ui/tests/syntaxkiste.rs` belegen, warum `two-face` daneben
# steht, statt es zu behaupten.
#
# **Der angenommene Preis, benannt statt verschwiegen.** `speculation:` Ob die
# Kiste die Maxime "superschnell" auf dem Referenzgeraet von 2018 haelt, ist
# ungemessen. Der Abnahmelauf, an dem man es messen wuerde, ist aus dieser Runde
# ausgeklammert; der Nutzer hat den Preis am 260808-0017 angenommen. Der Spec
# uebergibt die Kiste unter `## Verhaeltnis zu den zehn Zeitzusagen aus C8 der
# Runde 1` der spaeteren Messrunde als vierten Gegenstand neben L1, L4 und L7.
syntect = { version = "5.3.0", default-features = false, features = [
    "parsing",
    "default-syntaxes",
    "default-themes",
    "dump-load",
    "regex-fancy",
] }
# Die Sprachdefinitionen, die `syntect` nicht mitbringt. Es sind zwei Kisten und
# nicht eine, und der Grund ist gemessen und nicht angenommen: der Vorgabesatz
# von `syntect` fuehrt Rust, Markdown und Shell, aber kein TOML, und C3 verlangt
# TOML ausdruecklich. `two-face` traegt den erweiterten Satz von `bat` nach, 213
# Sprachdefinitionen gegenueber 75, und ist der uebliche Begleiter von
# `syntect`. Die Zeile, die den Befund festhaelt, ist
# `crates/krk-ui/tests/syntaxkiste.rs::ohne_two_face_fehlt_toml`; sie schlaegt
# fehl, sobald `syntect` TOML nachreicht, und das ist der Anlass, diese Kiste
# neu zu bewerten.
#
# Keine bestehende Abhaengigkeit leistet es aus demselben Grund wie oben.
#
# `default-features = false` ist auch hier die Bedingung: der Vorgabesatz
# `syntect-onig` schaltet in `syntect` `regex-onig` ein und holte Oniguruma
# durch die Hintertuer wieder herein. `syntect-fancy` haelt beide Kisten auf
# demselben reinen Rust.
#
# Was beide Kisten zusammen an Paketen mitbringen, steht oben bei `syntect` und
# wird hier nicht wiederholt: `two-face` haengt selbst an ihm, und zwei Zahlen
# fuer einen Baum waeren zwei Wahrheiten.
two-face = { version = "0.5.2", default-features = false, features = ["syntect-fancy"] }
# Der CommonMark-Zerleger, mit dem die Vorschau Markdown rendert (C4 der
# Runde 6), Antwort auf
# `circles/260812-1000-teilen-ordnersprung-ablage-sichern-vorschau-rendern/decisions/260812-1105_*`
# und auf die Frage, die der Circle dem Plan uebergeben hat: womit wird
# Markdown zerlegt.
#
# Drei Mittel lagen zur Wahl, und die beiden naheliegenden scheitern an je einer
# messbaren Eigenschaft:
#
# - **Apples eigenes Mittel**, `NSAttributedString` mit
#   `initWithMarkdown:options:baseURL:error:` (`NSAttributedString.h:203`, seit
#   macOS 12 und damit unter dem Bauziel), liefert keine Darstellung, sondern
#   Absichten: `NSPresentationIntent` und `NSInlinePresentationIntent`
#   (`:97-111`). Die Uebersetzung in Schriftgroesse, Schnitt und Einzug bliebe
#   bei KRK, der teure Teil waere also nicht abgenommen. Dazu zieht der volle
#   Umfang aufeinanderfolgende Leerzeichen zu einem zusammen (`:147`), und damit
#   fiele genau das Quelltextraster in sich zusammen, das der Nutzer am
#   260812-1105 fuer Tabellen festgelegt hat. Und das Ergebnis waere ein
#   Objective-C-Objekt: die Zerlegung wanderte unter `appkit/` und waere ohne
#   Fenster nicht mehr pruefbar.
# - **Die vorhandene `syntect`-Kiste** ueber `hervorhebung.rs` findet
#   Ueberschriften, Listen, Verweise und Quelltext bereits, ist aber mit
#   **0,3 MB/s** gemessen (Modulkopf von `crates/krk-ui/src/hervorhebung.rs`,
#   260810); der gerenderte Text einer Datei an der Grenze `TEXTGRENZE` stuende
#   erst nach rund 3,3 s da, und die Vorschau sagt ihn sofort zu. Dazu
#   entschieden fremde Sprachdefinitionen darueber, welche Zeichen als
#   `punctuation.definition.*` gelten und damit verschwinden; ein faelschlich
#   ausgeblendetes Zeichen ist eine falsche Auskunft ueber den Inhalt einer
#   Datei.
#
# Keine bestehende Abhaengigkeit leistet die Zerlegung: `icu_collator`
# sortiert, `signal-hook` faengt Signale, die `objc2`-Kisten reichen AppKit
# durch, und `syntect` faerbt ein, statt Auszeichnungszeichen zu entfernen.
#
# **Vier Zahlen, am 260812 auf diesem Geraet erhoben und nicht uebernommen.**
#
# - **Drei Abhaengigkeiten, davon zwei schon im Baum.** Ohne Vorgabemerkmale
#   fuehrt die Kiste `bitflags`, `memchr` und `unicase`; `bitflags 2.13.1` und
#   `memchr 2.8.3` stehen in genau diesen Fassungen bereits in `Cargo.lock`.
#   Neu sind damit zwei Eintraege, die Kiste selbst und `unicase 2.9.0`.
# - **Kein C-Code.** Weder `pulldown-cmark` noch `unicase` fuehrt eine `.c`-
#   oder `.h`-Datei. `unicase` hat kein `build.rs` (`build = false`);
#   `pulldown-cmark` hat eines, dessen Rumpf ohne das Merkmal `gen-tests` zu
#   nichts uebersetzt, und `gen-tests` ist kein Vorgabemerkmal. Die Zusage der
#   Technologiewahl haelt damit: die Bauvoraussetzungen aendern sich nicht.
# - **Die Mindestfassung passt.** `rust-version = "1.71.1"`, das Projekt faehrt
#   1.97.1.
# - **Die Geschwindigkeit traegt L7.** Ueber eine aus einem realistischen Muster
#   auf 1,05 MB vervielfachte Markdown-Datei kostet `markdown::rendern` im
#   Profil `release` in drei Laeufen 29,5 ms, 20,5 ms und 19,2 ms, also 36 bis
#   55 MB/s. Das ist rund das Hundertfache der Geschwindigkeit von `syntect`
#   und liegt an der Grenze `TEXTGRENZE` mit deutlichem Abstand unter den
#   100 ms, die L7 zusagt. Der Wert ist auf diesem Geraet gemessen; ob das
#   Referenzgeraet ihn haelt, sagt erst der Abnahmelauf.
#
# `default-features = false` laesst `html`, `getopts` und
# `pulldown-cmark-escape` weg, die KRK nicht nennt: die Kiste soll zerlegen und
# keine Seite bauen.
#
# **Das Merkmal fuer Tabellen bleibt aus, und das ist keine Sparsamkeit.** Es
# ist die Umsetzung des Nutzerentscheids vom 260812-1105: ohne
# `ENABLE_TABLES` liefert die Kiste die drei Zeilen einer Tabelle als drei
# `Text`-Ereignisse mit ihren Zwischenraeumen, getrennt durch weiche Umbrueche,
# und das Quelltextraster entsteht von selbst statt ueber eine Sonderregel.
pulldown-cmark = { version = "0.13", default-features = false }
