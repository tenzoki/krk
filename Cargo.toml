[workspace]
resolver = "3"
members = [
    "crates/krk-core",
    "crates/krk-ui",
    "crates/krk-bench",
    "xtask",
]

# Gemeinsame Paketangaben. Jedes Mitglied erbt sie ueber `field.workspace = true`,
# damit Version und Edition an einer Stelle stehen.
[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false

# Gemeinsame Abhaengigkeiten. Die Versionsangabe steht hier, das Mitglied nennt
# nur noch `workspace = true`.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
toml = "1"
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
