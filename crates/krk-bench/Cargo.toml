[package]
name = "krk-bench"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# Die Messstrecke misst den Verzeichnisleser des Kerns. Sie bindet ihn ueber
# den Pfad ein, weil beide im selben Workspace liegen und miteinander versioniert
# werden.
krk-core = { path = "../krk-core" }
# Der Messplan aus S21: `alle` schreibt `plan.toml`, und dessen Abschnitt
# `[sitzung]` ist die serde-Struktur aus `krk-core/src/ablage/sitzung.rs` —
# dieselbe Serialisierung, die die Anwendung beim Beenden schreibt.
serde = { workspace = true }
toml = { workspace = true }
