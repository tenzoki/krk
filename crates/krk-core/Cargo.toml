[package]
name = "krk-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
serde = { workspace = true }
toml = { workspace = true }
# Die Kollation der Namenssortierung. Sie steht hier und nicht in `krk-ui`,
# weil der Sortierschluessel im Kern entsteht: `verzeichnis::kollation` ist
# die einzige Stelle, die die Kiste nennt.
icu_collator = { workspace = true }
# Der Mustervergleich der Leseprofile. Er steht hier und nicht in `krk-ui`,
# weil C6.8 der Runde 16 Proben ohne Fenster verlangt: `krk-ui` hat kein
# Bibliotheksziel, eine Datei unter `crates/krk-ui/tests/` erreicht also nichts
# aus jener Kiste, und die abzaehlbaren Grenzen aus C6 waeren dort nicht zu
# belegen. `leseprofil::datei::pruefen` ist die einzige Stelle, die ein Muster
# uebersetzt.
regex = { workspace = true }
# Das Archivformat fuer Zip und Unzip. Es steht hier und nicht in `krk-ui`, weil
# der Lauf im Kern liegt: `operation::zippen` und `operation::entpacken` sind die
# einzigen Stellen, die die Kiste nennen, und ihre Proben brauchen den
# selbstabraeumenden Pruefordner aus `tests/gemeinsam/mod.rs`. `krk-ui` hat kein
# Bibliotheksziel, eine Datei unter `crates/krk-ui/tests/` erreicht also nichts
# aus jener Kiste, und ein gepacktes Archiv waere dort nicht zu belegen.
zip = { workspace = true }
# Das Deflate-Verfahren dazu. **Der Eintrag ist nicht ueberfluessig, obwohl kein
# Modul den Namen `flate2` nennt**: `zip` schaltet `flate2` ohne dessen
# Vorgabemerkmale ein und stellt damit gar kein Verfahren ein, worauf `flate2`
# den Bau mit "No compression backend selected" anhaelt. Erst dieser Eintrag mit
# den Vorgabemerkmalen stellt `miniz_oxide` ein, das reine Rust-Verfahren, das
# ueber `syntect` ohnehin schon im Baum steht. Er gehoert in dieselbe Kiste wie
# `zip`, denn auf die Merkmalsvereinigung ueber den Workspace ist kein Verlass:
# sie liesse `cargo build --workspace` gruen und `cargo test -p krk-core` rot.
flate2 = { workspace = true }
# Die Git-Anbindung der Stufe A. Sie steht hier und nicht in `krk-ui`, weil der
# Leser im Kern liegt: `git::leser` haelt das `Repository` und traegt fast jede
# Nennung der Kiste. **Die einzige Stelle ist er nicht**, und die zweite ist
# keine Nebensache: `git::mod` fuehrt `gix::ObjectId` mit `pub use` wieder aus,
# und ueber diese Wiederausfuhr traegt `krk-ui` den Objektnamen jedes Commits,
# ohne `gix` selbst zu fuehren; dazu kommt `gix::hash::Kind::Sha1` im Pruefmodul von
# `git::texte`. Wer die Kiste aus dem Kern loesen will, erhebt die Stellen mit
# `grep -rn 'gix::' crates/krk-core/src` und verlaesst sich nicht auf eine Zahl
# an dieser Stelle. `krk-ui` hat kein Bibliotheksziel, eine Datei
# unter `crates/krk-ui/tests/` erreicht also nichts aus jener Kiste, und die
# Sonderzustaende eines Repositorys — abgeloester HEAD, ungeborener HEAD, ein
# Unterordner statt der Wurzel — waeren dort gegen ein angelegtes
# Pruefrepository nicht zu belegen. Die Merkmalswahl und der Befund zu `cc` und
# `-sys` stehen in der Wurzel-`Cargo.toml`.
gix = { workspace = true }
