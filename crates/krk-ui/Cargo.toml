[package]
name = "krk-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# Das Binaerprogramm heisst `krk`, nicht `krk-ui`: unter diesem Namen liegt es
# spaeter in `KRK.app/Contents/MacOS/`.
[[bin]]
name = "krk"
path = "src/main.rs"

[dependencies]
# Das Ordnermodell und der Verzeichnisleser wohnen im Kern. Die Oberflaeche
# bindet ihn ueber den Pfad ein, weil beide im selben Workspace liegen und
# miteinander versioniert werden.
krk-core = { path = "../krk-core" }
# Der Messplan aus S21: `messmodus.rs` liest `plan.toml`, und dessen Abschnitt
# `[sitzung]` ist dieselbe serde-Struktur, die `session.toml` traegt. Beide
# Kisten stehen schon im Baum, weil `krk-core` sie fuehrt.
serde = { workspace = true }
toml = { workspace = true }
block2 = { workspace = true }
objc2 = { workspace = true }
# Das Merkmal `objc2-quartz-core` schaltet in `objc2-app-kit` die Methode
# `NSView.displayLinkWithTarget:selector:` frei; ohne sie gibt es keine
# Bildgrenze und damit keine ehrliche Messung von L1.
objc2-app-kit = { workspace = true, features = ["objc2-quartz-core"] }
objc2-foundation = { workspace = true }
# Unmittelbar genannt, weil `bildtakt.rs` den Typnamen `CADisplayLink`
# schreibt: der Takt wird festgehalten, nicht nur einmal gerufen.
objc2-quartz-core = { workspace = true }
# Die Parametertypen der FSEvents-Bindung in `appkit/fsevents.rs`. Die Kiste
# verlinkt `CoreFoundation`; `CoreServices`, wo `FSEventStreamCreate` liegt,
# verlinkt das `#[link]`-Attribut an jenem `extern`-Block.
objc2-core-foundation = { workspace = true }
# Der Weckruf, mit dem der Vermittlerfaden einer Dateioperation den Hauptfaden
# erreicht (S16). Er ist die eine Stelle, an der ein anderer Faden in AppKit
# hineinruft, und `dispatch_async` auf die Hauptschlange ist der Weg, den das
# System dafuer vorsieht. Ein eigener `CFRunLoopSource` waere derselbe
# Mechanismus mit mehr `unsafe`. Die Kiste liegt ohnehin im Baum, weil
# `objc2-foundation` sie fuehrt; hier steht sie als unmittelbare
# Abhaengigkeit von `krk-ui`.
dispatch2 = { workspace = true }
