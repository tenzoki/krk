<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Dual-pane file manager icon">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A1AB4"/>
      <stop offset="0.55" stop-color="#0A0A8C"/>
      <stop offset="1" stop-color="#04044F"/>
    </linearGradient>
    <clipPath id="squircle">
      <rect x="0" y="0" width="1024" height="1024" rx="232" ry="232"/>
    </clipPath>
  </defs>

  <g clip-path="url(#squircle)">
    <rect x="0" y="0" width="1024" height="1024" fill="url(#bg)"/>

    <!-- linkes Panel: aktiv, heller Rahmen -->
    <rect x="112" y="128" width="380" height="672" fill="none" stroke="#6FF2F2" stroke-width="14"/>
    <line x1="126" y1="212" x2="478" y2="212" stroke="#6FF2F2" stroke-width="8" opacity="0.55"/>

    <!-- Auswahlbalken (Signatur) -->
    <rect x="133" y="344" width="338" height="88" fill="#55FFFF"/>

    <rect x="152" y="256" width="230" height="44" fill="#C9DDFF"/>
    <rect x="152" y="366" width="196" height="44" fill="#0A0A8C"/>
    <rect x="152" y="444" width="190" height="44" fill="#FFD24A"/>
    <rect x="152" y="538" width="250" height="44" fill="#C9DDFF"/>
    <rect x="152" y="632" width="170" height="44" fill="#C9DDFF"/>
    <rect x="152" y="726" width="214" height="44" fill="#C9DDFF"/>

    <!-- rechtes Panel: inaktiv, gedimmter Rahmen -->
    <rect x="532" y="128" width="380" height="672" fill="none" stroke="#2FA9BE" stroke-width="10"/>
    <line x1="546" y1="212" x2="898" y2="212" stroke="#2FA9BE" stroke-width="7" opacity="0.55"/>

    <rect x="572" y="256" width="200" height="44" fill="#9EBCE8"/>
    <rect x="572" y="350" width="248" height="44" fill="#9EBCE8"/>
    <rect x="572" y="444" width="176" height="44" fill="#FFD24A"/>
    <rect x="572" y="538" width="262" height="44" fill="#9EBCE8"/>
    <rect x="572" y="632" width="150" height="44" fill="#9EBCE8"/>
    <rect x="572" y="726" width="222" height="44" fill="#9EBCE8"/>

    <!-- F-Tasten-Leiste -->
    <g fill="#2FA9BE">
      <rect x="112" y="848" width="148" height="48"/>
      <rect x="276" y="848" width="148" height="48"/>
      <rect x="440" y="848" width="148" height="48"/>
      <rect x="604" y="848" width="148" height="48"/>
      <rect x="768" y="848" width="144" height="48"/>
    </g>
  </g>
</svg>
